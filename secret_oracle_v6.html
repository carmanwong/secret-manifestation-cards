<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>祕密顯化指引卡</title>
  <style>
    :root {
      --gold: #d4af37;
      --gold-light: #f4dd97;
      --paper: #f9f1d7;
      --deep-red: #721c1a;
      --ink: #2b1d16;
      --card-w: 340px;
      --card-h: 560px;
    }
    
    body, html {
      margin: 0; padding: 0; min-height: 100%;
      background: #0d0605;
      font-family: "Baskerville", "Times New Roman", "PingFang TC", serif;
      color: var(--paper);
      overflow-x: hidden;
    }

    .universe {
      position: fixed; inset: 0;
      background: radial-gradient(circle at 50% 50%, #2a0a08 0%, #0d0605 100%);
      z-index: -1;
    }

    .mode-switch {
      position: fixed; top: 25px; left: 50%; transform: translateX(-50%);
      display: flex; background: rgba(0,0,0,0.6); backdrop-filter: blur(20px);
      padding: 5px; border-radius: 999px; z-index: 2000; border: 1px solid rgba(212,175,55,0.3);
    }
    .mode-btn {
      padding: 8px 24px; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: 14px;
      transition: 0.3s; border: none; background: transparent; color: rgba(244,221,151,0.5);
      letter-spacing: 1.5px;
    }
    .mode-btn.active { background: var(--gold); color: #1a0d0c; }

    #oracle-view {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; padding: 40px 20px; text-align: center; box-sizing: border-box;
    }

    .brand-logo {
      width: 90px; height: 90px; 
      background: radial-gradient(circle at top left, #a3221e, #6e110f);
      border-radius: 50%;
      border: 2px solid var(--gold); margin-bottom: 30px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 40px rgba(212, 175, 55, 0.4), inset 0 0 15px rgba(0,0,0,0.8);
      position: relative;
    }
    .brand-logo::before {
      content: ""; position: absolute; inset: -8px; border: 1px dashed rgba(212, 175, 55, 0.5); border-radius: 50%;
      animation: spin 20s linear infinite;
    }
    .brand-logo::after { content: "祕"; font-size: 44px; color: var(--gold); font-family: "PingFang TC", serif; text-shadow: 0 2px 5px rgba(0,0,0,0.8); }

    header h1 { 
      font-size: 46px; margin: 0; letter-spacing: 8px; 
      background: linear-gradient(to bottom, #fff6d9, #d4af37, #aa8529);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }
    header p { color: var(--gold-light); opacity: 0.8; margin-top: 15px; font-size: 16px; letter-spacing: 4px; text-transform: uppercase; }

    .deck-container {
      margin-top: 60px; width: 210px; height: 315px; cursor: pointer;
      position: relative; perspective: 1200px;
      animation: float 4s ease-in-out infinite;
    }
    .deck-container::before {
      content: ""; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 140%; height: 140%;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.2) 0%, transparent 60%);
      z-index: -1; animation: aura-pulse 3s ease-in-out infinite alternate;
    }
    .card-pile {
      position: absolute; inset: 0; 
      background: linear-gradient(135deg, #8a201c, #5e110f);
      border-radius: 16px; border: 2px solid var(--gold);
      box-shadow: 
        0 20px 50px rgba(0,0,0,0.9), 
        0 5px 0 #a3821a,
        0 10px 0 #4a0d0b,
        inset 0 0 20px rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .card-pile::before {
      content: ""; position: absolute; inset: 10px; border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 8px;
    }
    .card-pile .secret-text { 
      font-size: 32px; letter-spacing: 12px; color: var(--gold); 
      text-shadow: 0 2px 10px rgba(0,0,0,0.8); 
      font-weight: 300; margin-left: 12px;
    }

    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
    @keyframes aura-pulse { 0% { opacity: 0.4; transform: translate(-50%, -50%) scale(0.9); } 100% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); } }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    #library-view { display: none; padding: 120px 20px 60px; max-width: 1400px; margin: 0 auto; }
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; justify-items: center; }

    .card-visual {
      width: var(--card-w); height: var(--card-h);
      background: #fdfaf0 url("assets/original-card-background.png") center/cover no-repeat;
      border: 12px solid var(--card-border, #9d2b2b);
      border-radius: 20px; position: relative;
      display: flex; flex-direction: column;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      overflow: hidden; color: var(--ink);
    }
    .card-visual::before { content: ""; position: absolute; inset: 8px; border: 1.5px solid rgba(212, 175, 55, 0.5); border-radius: 10px; pointer-events: none; }

    .card-inner { flex: 1; padding: 60px 30px; display: flex; flex-direction: column; align-items: center; position: relative; z-index: 2; text-align: center; }
    h2 { font-size: 26px; font-weight: 700; color: #2d1f19; margin: 0 0 40px; line-height: 1.3; font-family: "PingFang TC", sans-serif; }
    .card-body-text { font-size: 18px; line-height: 2; color: #33251f; font-weight: 400; flex: 1; display: flex; align-items: center; justify-content: center; font-family: "PingFang TC", sans-serif; white-space: pre-line; }

    #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.97); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 3000; padding: 20px; backdrop-filter: blur(15px); }
    .ai-advice { margin-top: 30px; color: var(--gold-light); font-size: 17px; max-width: 360px; text-align: center; font-style: italic; border-top: 1px solid rgba(212,175,55,0.2); padding-top: 20px; }

    .actions { margin-top: 30px; display: flex; gap: 15px; width: 100%; max-width: 340px; }
    .btn { flex: 1; padding: 14px 0; border-radius: 999px; font-weight: bold; cursor: pointer; border: none; font-size: 16px; text-align: center; }
    .btn-gold { background: linear-gradient(180deg, #f4dd97, #d4af37); color: #1a0f0d; }
    .btn-outline { background: transparent; border: 1.5px solid var(--gold); color: var(--gold); }

    .shaking { animation: shuffle 0.6s infinite; }
    @keyframes shuffle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(3deg) translateY(-5px); } 75% { transform: rotate(-3deg) translateY(-5px); } }
    @keyframes flipIn { from { transform: scale(0.8) rotateY(-90deg); opacity: 0; } to { transform: scale(1) rotateY(0); opacity: 1; } }
    .animate-flip { animation: flipIn 0.6s forwards; }

    .library-card { transform: scale(0.9); transition: 0.3s; cursor: pointer; }
    .library-card:hover { transform: scale(0.95); }

    @media (max-width: 480px) {
      :root { --card-w: 300px; --card-h: 500px; }
      header h1 { font-size: 32px; }
    }
  </style>
</head>
<body>
  <div class="universe"></div>
  <div class="mode-switch">
    <button id="btn-oracle" class="mode-btn active" onclick="switchMode('oracle')">請示祕密</button>
    <button id="btn-library" class="mode-btn" onclick="switchMode('library')">館藏圖鑑</button>
  </div>
  
  <div id="oracle-view">
    <div class="brand-logo"></div>
    <header><h1>祕密</h1><p>顯化實相指引卡</p></header>
    <div class="deck-container" onclick="handleDraw()"><div class="card-pile" id="deck-top"><div class="secret-text">祕密</div></div></div>
    <p style="margin-top: 40px; font-size: 13px; opacity: 0.5; letter-spacing: 4px;">點擊卡牌，開啟顯化指引</p>
  </div>

  <div id="library-view">
    <header style="text-align:center; margin-bottom: 60px;"><h1>館藏圖鑑</h1><p>探索神聖真理</p></header>
    <div class="card-grid" id="grid"></div>
  </div>

  <div id="overlay">
    <article id="active-card" class="card-visual">
      <div class="card-inner"><h2 id="title"></h2><div class="card-body-text" id="text"></div></div>
    </article>
    <div class="ai-advice" id="explanation"></div>
    <div class="actions">
      <button class="btn btn-outline" onclick="closeOverlay()">關閉</button>
      <button class="btn btn-gold" onclick="alert('截圖保存顯化！')">顯化</button>
    </div>
  </div>

  <script>

    const db = {"deck": {"name_zh": "祕密實現卡", "name_en": "The Secret Manifestation Cards", "author": "Rhonda Byrne", "total_cards": 65, "language": "繁體中文", "source_note": "由使用者提供的商品圖和牌卡照片整理；只收錄圖片中可見或大致可辨認的卡牌。", "copyright_note": "建議作個人索引用途。若日後公開網站或 app，請改用摘要、筆記、引用來源或取得授權圖片。"}, "summary": {"unique_visible_cards": 50, "needs_review_cards": 0, "uncertain_sightings": 4, "estimated_missing_cards": 15, "source_images": 12}, "cards": [{"id": "SMC-001", "title_zh": "感恩之情就是財富", "visible_text": "「每日的感恩練習，是財富降臨你身上的管道之一。」

——華勒思·華特斯（Wallace D. Wattles），
《失落的致富經典》作者", "border_colors": ["green"], "border_color": "green", "source_images": ["source_images/01_green_gratitude.jpg", "source_images/08_table_green.webp"], "visibility": "clear", "confidence": 0.99, "status": "collected"}, {"id": "SMC-002", "title_zh": "這個世界需要你的快樂", "visible_text": "苦難或不幸的人生無法幫助這個世界。你被剝奪最想要的東西，這樣的生活也無助於這個世界。但你的快樂、你的豐盛和你充實的人生，可以讓整個世界都振奮起來。", "border_colors": ["red"], "border_color": "red", "source_images": ["source_images/03_promo_overview.jpg"], "visibility": "clear", "confidence": 0.95, "status": "collected"}, {"id": "SMC-003", "title_zh": "今天來創造你的明天", "visible_text": "這是在床上就能進行的強效練習：醒睜、回顧當天的美好時刻，愛心地表示感謝。想想明天，並計劃把明天活成人生中最精采的一天。", "border_colors": ["green"], "border_color": "green", "source_images": ["source_images/03_promo_overview.jpg", "source_images/08_table_green.webp"], "visibility": "clear", "confidence": 0.94, "status": "collected"}, {"id": "SMC-004", "title_zh": "我有覺察嗎？", "visible_text": "要加強覺知，就停下來問自己：「我現在在想什麼？我現在有什麼感覺？」或者，你也可以問自己：「我有覺察嗎？」一旦你這麼問，你就開始覺察了，因為你把你的意念帶回了當下。", "border_colors": ["pink"], "border_color": "pink", "source_images": ["source_images/03_promo_overview.jpg", "source_images/11_table_pink_white.webp"], "visibility": "clear", "confidence": 0.98, "status": "collected"}, {"id": "SMC-005", "title_zh": "改變意念，改變未來", "visible_text": "每天入睡前，回顧這一天的經歷。如果有不如意的事件，就在腦中用你想要的方式重新演練一遍。現在，你已經徹底改變了你的未來。", "border_colors": ["blue_green"], "border_color": "blue_green", "source_images": ["source_images/03_promo_overview.jpg", "source_images/05_table_blue_green.webp"], "visibility": "clear", "confidence": 0.96, "status": "collected"}, {"id": "SMC-006", "title_zh": "感恩具有強大的實現力", "visible_text": "請記住：想倍增力大或小，是你決定的。不斷感恩引來更多天地，不斷帶可引來更多美好。", "border_colors": ["burgundy"], "border_color": "burgundy", "source_images": ["source_images/04_table_burgundy.webp"], "visibility": "clear", "confidence": 0.86, "status": "collected", "notes": "細字有少量不確定，建議日後用更清晰單卡照校對。"}, {"id": "SMC-007", "title_zh": "意念會化為現實", "visible_text": "", "border_colors": ["burgundy"], "border_color": "burgundy", "source_images": ["source_images/04_table_burgundy.webp"], "visibility": "partial", "confidence": 0.9, "status": "collected"}, {"id": "SMC-008", "title_zh": "免於焦慮", "visible_text": "一切都聽從吸引力法則向你展現有意義的一切。如果你要焦慮和憂慮，你想要的事物會來嗎？那就做出這個選擇：「我總是無阻的。」", "border_colors": ["burgundy"], "border_color": "burgundy", "source_images": ["source_images/04_table_burgundy.webp"], "visibility": "clear", "confidence": 0.82, "status": "collected"}, {"id": "SMC-009", "title_zh": "你的職責在於自己", "visible_text": "你無法替他人創造人生。你不能幫別人思考，如果你強加自己的意見在別人身上，你就會吸引同樣的遭遇發生在自己身上。所以讓別人去開創他們想要的生活吧，把你無窮無盡的力量集中用來創造你自己最精采的人生。", "border_colors": ["burgundy"], "border_color": "burgundy", "source_images": ["source_images/04_table_burgundy.webp"], "visibility": "clear", "confidence": 0.95, "status": "collected"}, {"id": "SMC-010", "title_zh": "你生來就是創作者", "visible_text": "你在這顆輝煌燦爛的行星上，擁有開創人生的奇妙力量。你自己創造的體驗沒有極限，你的心念是不受限制的。", "border_colors": ["blue"], "border_color": "blue", "source_images": ["source_images/04_table_burgundy.webp"], "visibility": "clear", "confidence": 0.95, "status": "collected"}, {"id": "SMC-011", "title_zh": "沒有限制，沒有欠缺", "visible_text": "如果你有這個意識，很可能你在人生中體驗到限制和匱乏。你的心思是過著一切美好的創造力，怎麼會有任何缺乏呢？不可能的！你有無限的念力，所以能化無限的意念為現實。", "border_colors": ["blue"], "border_color": "blue", "source_images": ["source_images/04_table_burgundy.webp"], "visibility": "clear", "confidence": 0.92, "status": "collected"}, {"id": "SMC-012", "title_zh": "專注於解決問題", "visible_text": "當你抗拒目前的處境，你就給予這個處境更多能量和力量。這個事件或狀況只會越來越大，因為這是宇宙的法則. 要讓這個你不想要的情況變小，就把你的能量和力量集中在你想要的境遇上。", "border_colors": ["blue"], "border_color": "blue", "source_images": ["source_images/04_table_burgundy.webp"], "visibility": "clear", "confidence": 0.94, "status": "collected"}, {"id": "SMC-013", "title_zh": "改變心念，改變人生", "visible_text": "", "border_colors": ["blue"], "border_color": "blue", "source_images": ["source_images/05_table_blue_green.webp"], "visibility": "clear", "confidence": 0.9, "status": "collected"}, {"id": "SMC-014", "title_zh": "只要專注於豐盛", "visible_text": "", "border_colors": ["blue"], "border_color": "blue", "source_images": ["source_images/05_table_blue_green.webp"], "visibility": "clear", "confidence": 0.9, "status": "collected"}, {"id": "SMC-015", "title_zh": "金錢願望不是努力地朝我而來", "visible_text": "", "border_colors": ["blue"], "border_color": "blue", "source_images": ["source_images/05_table_blue_green.webp"], "visibility": "partial", "confidence": 0.62, "status": "needs_review"}, {"id": "SMC-016", "title_zh": "幸福會吸引你想要的一切", "visible_text": "", "border_colors": ["blue"], "border_color": "blue", "source_images": ["source_images/05_table_blue_green.webp"], "visibility": "partial", "confidence": 0.86, "status": "collected"}, {"id": "SMC-017", "title_zh": "感恩是實現心願的快速通道", "visible_text": "想要大幅加快經驗實現的速度，就把感恩融合到創造的三個步驟中：要求、相信、接收。進行第一步「要求」時，不滿於口語和要求物的事物。", "border_colors": ["blue"], "border_color": "blue", "source_images": ["source_images/05_table_blue_green.webp"], "visibility": "clear", "confidence": 0.88, "status": "collected"}, {"id": "SMC-018", "title_zh": "你的人生就在你手中", "visible_text": "", "border_colors": ["blue"], "border_color": "blue", "source_images": ["source_images/06_table_blue.webp"], "visibility": "clear", "confidence": 0.93, "status": "collected"}, {"id": "SMC-019", "title_zh": "思而後行", "visible_text": "養成習慣，每天都先在腦海中思考人生事件的後果。在你去任何地方、做任何事之前，都讓宇宙之力為你鋪路。你只要在事情思考你要的發展就行了。如此一來，你就是在有意識地開創人生。", "border_colors": ["blue"], "border_color": "blue", "source_images": ["source_images/06_table_blue.webp"], "visibility": "clear", "confidence": 0.94, "status": "collected"}, {"id": "SMC-020", "title_zh": "相信你已經收到了", "visible_text": "宇宙不需要時間來實現你的願望。你慢慢得到的不準時，是因為你還不相信。不知道、沒感覺到你已經擁有，這是因為你把自己放在「想要」的頻率上。當你把自己放在「已經擁有」的頻率上，你想要的就會出現。", "border_colors": ["blue_green"], "border_color": "blue_green", "source_images": ["source_images/06_table_blue.webp"], "visibility": "clear", "confidence": 0.92, "status": "collected"}, {"id": "SMC-021", "title_zh": "人生應該輕鬆不費力", "visible_text": "", "border_colors": ["light_blue"], "border_color": "light_blue", "source_images": ["source_images/06_table_blue.webp"], "visibility": "clear", "confidence": 0.93, "status": "collected"}, {"id": "SMC-022", "title_zh": "吸引力法則一直在聽", "visible_text": "如果你覺得人生很困苦、艱難，根據吸引力法則，你的人生就會變得很困苦、艱難。
現在就改口：

「人生輕鬆不費力。」

「人生很精采。」

「一切都會順順利利。」", "border_colors": ["blue"], "border_color": "blue", "source_images": ["source_images/06_table_blue.webp"], "visibility": "clear", "confidence": 0.98, "status": "collected"}, {"id": "SMC-023", "title_zh": "善意是雙贏的", "visible_text": "當你對別人懷有善意，你將會體驗到那些善意體驗在你身上. 你不能用惡意傷害別人，你只會傷害自己。如果你對他人抱有善念，猜猜誰會受惠？就是你！", "border_colors": ["blue"], "border_color": "blue", "source_images": ["source_images/06_table_blue.webp"], "visibility": "clear", "confidence": 0.97, "status": "collected"}, {"id": "SMC-024", "title_zh": "注意力就是一切", "visible_text": "如果你在想某件事、在談論某件事，你就是在邀請這件事來到你的生命中。", "border_colors": ["blue"], "border_color": "blue", "source_images": ["source_images/07_table_teal.webp"], "visibility": "clear", "confidence": 0.96, "status": "collected"}, {"id": "SMC-025", "title_zh": "多想想你要什麼", "visible_text": "人之所以沒有活在夢想中的人生裡，唯一的原因在於：他們太常想著自己不想要什麼，而不是他們想要什麼。實際上，如果你只想著你要什麼，你就只會得到你所想要的。", "border_colors": ["light_blue"], "border_color": "light_blue", "source_images": ["source_images/07_table_teal.webp"], "visibility": "clear", "confidence": 0.95, "status": "collected"}, {"id": "SMC-026", "title_zh": "在你動念之前……", "visible_text": "「每個意念都成真，除非你用相反的意念去抵消它。」—— 萊斯特・雷文森（Lester Levenson），生命導師", "border_colors": ["light_blue"], "border_color": "light_blue", "source_images": ["source_images/07_table_teal.webp"], "visibility": "clear", "confidence": 0.96, "status": "collected"}, {"id": "SMC-027", "title_zh": "改變人生就靠感恩", "visible_text": "感恩帶來教育，抱怨帶來教育，這是你選擇手中的黃金守則。適用於幸福與健康、人際關係、工作與財富。", "border_colors": ["teal"], "border_color": "teal", "source_images": ["source_images/07_table_teal.webp"], "visibility": "clear", "confidence": 0.86, "status": "collected"}, {"id": "SMC-028", "title_zh": "你擁有無懈可擊的健康", "visible_text": "", "border_colors": ["teal"], "border_color": "teal", "source_images": ["source_images/07_table_teal.webp"], "visibility": "clear", "confidence": 0.96, "status": "collected"}, {"id": "SMC-029", "title_zh": "珍惜會強化人際關係", "visible_text": "想要讓一段很難經營的關係變得更好，我們就要把注意力集中在欣賞對方。當我們抱怨一段關係時，就只會吸引更多想要抱怨的事情。在接下來的 28 天裡，寫下你欣賞對方的所有事情，每天都多寫一點點，你將會看到你的珍惜如何化腐朽為神奇。", "border_colors": ["green"], "border_color": "green", "source_images": ["source_images/07_table_teal.webp"], "visibility": "clear", "confidence": 0.96, "status": "collected"}, {"id": "SMC-030", "title_zh": "數算你的祝福", "visible_text": "養成每天坐下來寫下十項祝福的習慣. 即使你只做這個練習，它也能翻轉你的人生。", "border_colors": ["green"], "border_color": "green", "source_images": ["source_images/08_table_green.webp"], "visibility": "clear", "confidence": 0.97, "status": "collected"}, {"id": "SMC-031", "title_zh": "想要有精彩的一天，就讓早晨充滿感恩之心", "visible_text": "你可以和我一樣，下床走去浴室或廚房的時候，就輕柔而緩慢地步伐，每踏出一步都說「謝謝」。你正在感謝你所擁有的一切、你愛的每一個人，還有今天即將發生的一切好事！", "border_colors": ["green"], "border_color": "green", "source_images": ["source_images/08_table_green.webp"], "visibility": "clear", "confidence": 0.94, "status": "collected"}, {"id": "SMC-032", "title_zh": "現在就選擇幸福", "visible_text": "抗拒可能讓你願望實現。當你不能定自己是否能實現你想要的一切，而開始感到焦慮或偏離時，就是在創造抗拒和阻礙。只要在願望還沒實現之前，現在找到一種感覺幸福快樂的方式，你就可以消除這些創造抗拒、阻礙心願的負面感受。", "border_colors": ["green"], "border_color": "green", "source_images": ["source_images/08_table_green.webp"], "visibility": "clear", "confidence": 0.88, "status": "collected"}, {"id": "SMC-033", "title_zh": "感激你所擁有的一切", "visible_text": "當你對你所擁有的一切心存感激，你不僅會看到你所擁有的事物越來越多，同時你也會打開一道大門，迎接你渴望的一切，迎來真正幸福圓滿的人生。", "border_colors": ["green"], "border_color": "green", "source_images": ["source_images/08_table_green.webp"], "visibility": "clear", "confidence": 0.97, "status": "collected"}, {"id": "SMC-034", "title_zh": "你抗拒的一直都在", "visible_text": "顯然不想論你多堅強烈地不想要某事，你都在邀請那件事靠近你。不抗拒你的強烈情緒投放在你想要的事物上，將你想要的事物引向你。", "border_colors": ["yellow_green"], "border_color": "yellow_green", "source_images": ["source_images/09_table_olive_yellow.webp"], "visibility": "clear", "confidence": 0.84, "status": "collected"}, {"id": "SMC-035", "title_zh": "注意力就是實現力", "visible_text": "加上情緒的專注就是強大的實現力！", "border_colors": ["olive"], "border_color": "olive", "source_images": ["source_images/09_table_olive_yellow.webp"], "visibility": "clear", "confidence": 0.95, "status": "collected"}, {"id": "SMC-036", "title_zh": "過最棒的一天", "visible_text": "你是否為今天做了計畫？還是你打算睡昨天的思緒，繼續主導著今天？以下這些話能帶給你好的開始：今天所有的好事都會降臨到我身上。今天我的願望都能實現. 今天魔法和奇蹟會一直跟隨著我。", "border_colors": ["olive"], "border_color": "olive", "source_images": ["source_images/09_table_olive_yellow.webp"], "visibility": "clear", "confidence": 0.94, "status": "collected"}, {"id": "SMC-037", "title_zh": "你有能力締造世界和平", "visible_text": "這個世界會變化，我們的地球會變化，如同每個人的內心都在變化，一個人可以影響千萬其他人，他們再次影響千萬人，該千萬人又會影響十億人，我們就是用這個方式為地球帶來和平、和諧。", "border_colors": ["yellow"], "border_color": "yellow", "source_images": ["source_images/09_table_olive_yellow.webp"], "visibility": "clear", "confidence": 0.96, "status": "collected"}, {"id": "SMC-038", "title_zh": "幸福吸引幸福", "visible_text": "這個公式真是簡單明瞭。你必須現在就感到幸福快樂，才能憑藉吸引力法則，把讓你感到幸福快樂的一切吸引到生命中。", "border_colors": ["orange"], "border_color": "orange", "source_images": ["source_images/10_table_orange_red.webp"], "visibility": "clear", "confidence": 0.96, "status": "collected"}, {"id": "SMC-039", "title_zh": "你的力量就在心中", "visible_text": "當你越想越糟時，運用方法可以讓你停下來：深吸一口氣，把注意力集中在心口，專注感受心中的愛。", "border_colors": ["orange"], "border_color": "orange", "source_images": ["source_images/10_table_orange_red.webp"], "visibility": "clear", "confidence": 0.94, "status": "collected"}, {"id": "SMC-040", "title_zh": "你的自然狀態就是喜悅", "visible_text": "", "border_colors": ["orange"], "border_color": "orange", "source_images": ["source_images/10_table_orange_red.webp"], "visibility": "clear", "confidence": 0.93, "status": "collected"}, {"id": "SMC-041", "title_zh": "你只需要保持正面和善意", "visible_text": "想要活出最精采的人生，其實很簡單：正面的意念、正面的話語、善意的舉動，就是這樣！", "border_colors": ["orange"], "border_color": "orange", "source_images": ["source_images/10_table_orange_red.webp"], "visibility": "clear", "confidence": 0.97, "status": "collected"}, {"id": "SMC-042", "title_zh": "感謝你所面對的挑戰", "visible_text": "", "border_colors": ["red"], "border_color": "red", "source_images": ["source_images/10_table_orange_red.webp"], "visibility": "partial", "confidence": 0.88, "status": "collected"}, {"id": "SMC-043", "title_zh": "金錢不能帶來快樂，但快樂能創造金錢", "visible_text": "如果你一直想著「我需要錢」，那你就會一直吸引「需要錢」的境遇。你現在必須找到不用錢就能快樂的方式，現在就感到心滿意足，沉浸在喜悅中，因為美好的感覺才是把金錢吸引過來的關鍵。", "border_colors": ["red"], "border_color": "red", "source_images": ["source_images/10_table_orange_red.webp"], "visibility": "clear", "confidence": 0.96, "status": "collected"}, {"id": "SMC-044", "title_zh": "你是永恆的存在", "visible_text": "看著你周遭的世界。沒有你的話，這一切都不存在。不管你原本對自己有什麼誤會，你現在已經認識真正的自己了。你是宇宙的主人。你是這王國的繼承者。你是生命的完美傑作。", "border_colors": ["white"], "border_color": "white", "source_images": ["source_images/11_table_pink_white.webp"], "visibility": "clear", "confidence": 0.98, "status": "collected"}, {"id": "SMC-045", "title_zh": "地球為你而轉動", "visible_text": "海洋為你漲潮退潮。鳥兒為你歌唱。太陽為你日升日落. 星星為你閃耀。你所見的一切美好，你所經歷的一切奇妙，都為你而現。", "border_colors": ["pink"], "border_color": "pink", "source_images": ["source_images/11_table_pink_white.webp"], "visibility": "clear", "confidence": 0.98, "status": "collected"}, {"id": "SMC-046", "title_zh": "你想什麼，你就成為什麼", "visible_text": "你越常運用自身的力量，就越能吸引它到你身邊。終有一天，你將不再需要練習，因為你就是力量，你就是完美，你就是智慧，你就是聰穎，你就是愛，你就是樂。", "border_colors": ["pink"], "border_color": "pink", "source_images": ["source_images/11_table_pink_white.webp"], "visibility": "clear", "confidence": 0.98, "status": "collected"}, {"id": "SMC-047", "title_zh": "現在就給自己好心情", "visible_text": "現在就愛開心，現在就感受好心情，這是你唯一需要做的事情。如果這是你從這套牌卡得到的唯一訊息，那麼你已經獲得了《祕密》裡最重要的一部分。", "border_colors": ["pink"], "border_color": "pink", "source_images": ["source_images/11_table_pink_white.webp"], "visibility": "clear", "confidence": 0.96, "status": "collected"}, {"id": "SMC-048", "title_zh": "先從內在活出你的夢想", "visible_text": "在你的腦海中看見夢想，在你的心中感受夢想，直到夢想變得無比真實，然後它就會在你的生命中成真。", "border_colors": ["orange"], "border_color": "orange", "source_images": ["source_images/manual_entry"], "visibility": "clear", "confidence": 0.99, "status": "collected"}, {"id": "SMC-049", "title_zh": "別執著在負面的     const colorMap = { green: '#3a9d5d', red: '#c63b43', pink: '#e06bb2', blue_green: '#45b9c8', burgundy: '#7e2a35', blue: '#426fcf', light_blue: '#74d5ef', teal: '#28a79a', yellow_green: '#7fb62e', olive: '#a79e28', yellow: '#e2b62a', orange: '#e98f1f', white: '#f2ede1' };
    
    function switchMode(m) {
        console.log('Switching mode:', m);
        document.getElementById('oracle-view').style.display = (m === 'oracle') ? 'flex' : 'none';
        document.getElementById('library-view').style.display = (m === 'library') ? 'block' : 'none';
        document.getElementById('btn-oracle').classList.toggle('active', m === 'oracle');
        document.getElementById('btn-library').classList.toggle('active', m === 'library');
        if (m === 'library') renderLibrary();
    }

    function renderLibrary() {
        console.log('Rendering library...');
        const g = document.getElementById('grid');
        g.innerHTML = db.cards.map(c => {
            const clr = colorMap[c.border_color] || '#d4af37';
            const txt = (c.visible_text || '').substring(0, 50) + '...';
            return "<div class='card-visual library-card' data-id='" + c.id + "' style='--card-border: " + clr + "'>" +
                "<div class='card-inner'>" +
                    "<h2>" + c.title_zh + "</h2>" +
                    "<div class='card-body-text'>" + txt + "</div>" +
                "</div>" +
            "</div>";
        }).join('');
    }

    // Use event delegation for clicks in library
    document.addEventListener('DOMContentLoaded', () => {
        const grid = document.getElementById('grid');
        if (grid) {
            grid.addEventListener('click', function(e) {
                const cardEl = e.target.closest('.library-card');
                if (cardEl) {
                    const id = cardEl.getAttribute('data-id');
                    showSpecificCard(id);
                }
            });
        }
    });

    function handleDraw() {
        console.log('Handle draw');
        const d = document.getElementById('deck-top');
        d.classList.add('shaking');
        setTimeout(() => { d.classList.remove('shaking'); revealCard(); }, 1200);
    }

    function revealCard() {
        const c = db.cards[Math.floor(Math.random() * db.cards.length)];
        updateOverlay(c, '你的思想具有磁性。你正在吸引此現實。');
    }

    function showSpecificCard(id) {
        console.log('Show specific card:', id);
        const c = db.cards.find(x => x.id === id);
        if (c) updateOverlay(c, '專注於這項真理。');
    }

    function updateOverlay(c, m) {
        console.log('Updating overlay for:', c.title_zh);
        document.getElementById('title').innerText = c.title_zh;
        document.getElementById('text').innerText = c.visible_text || '';
        document.getElementById('explanation').innerText = m;
        const ac = document.getElementById('active-card');
        ac.style.setProperty('--card-border', colorMap[c.border_color] || '#d4af37');
        ac.classList.remove('animate-flip');
        void ac.offsetWidth;
        ac.classList.add('animate-flip');
        document.getElementById('overlay').style.display = 'flex';
    }

    function closeOverlay() { document.getElementById('overlay').style.display = 'none'; }
    
    // Initial view
    switchMode('oracle');
</script>
