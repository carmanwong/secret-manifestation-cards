<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>祕密實現卡</title>
  <style>
    :root {
      --cream: #fff7ea;
      --gold: #b77a24;
      --gold-soft: #e9c98b;
      --gold-line: rgba(186, 133, 53, 0.34);
      --ink: #6b4317;
      --ink-soft: rgba(107, 67, 23, 0.72);
      --rose: #d83c7d;
      --rose-deep: #b41d59;
      --shadow: 0 18px 38px rgba(76, 43, 9, 0.18);
      --screen-w: min(100vw, 480px);
      --safe-bottom: max(18px, env(safe-area-inset-bottom));
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #f0dbc0;
      font-family: "Iowan Old Style", "Times New Roman", "PingFang TC", "Noto Serif TC", serif;
      color: var(--ink);
    }

    body {
      display: flex;
      justify-content: center;
    }

    .app-shell {
      position: relative;
      width: var(--screen-w);
      min-height: 100vh;
      overflow-x: hidden;
      background:
        linear-gradient(rgba(255, 248, 236, 0.18), rgba(255, 248, 236, 0.18)),
        url("./assets/manifestation-ui-kit/backgrounds/golden-altar-background.png") center top / cover no-repeat;
    }

    .app-shell::before {
      content: "";
      position: fixed;
      inset: 0;
      width: var(--screen-w);
      margin: 0 auto;
      pointer-events: none;
      background:
        radial-gradient(circle at top right, rgba(255,255,255,0.52), transparent 28%),
        radial-gradient(circle at left 70%, rgba(255,255,255,0.18), transparent 24%);
      mix-blend-mode: screen;
    }

    .screen {
      display: none;
      min-height: 100vh;
      padding: 18px 16px calc(124px + var(--safe-bottom));
      position: relative;
    }

    .screen.active { display: block; }

    .top-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .icon-circle {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid rgba(150, 100, 23, 0.18);
      background: rgba(255, 250, 242, 0.9);
      box-shadow: 0 8px 20px rgba(114, 76, 20, 0.14);
      display: grid;
      place-items: center;
      color: var(--ink);
      cursor: pointer;
      backdrop-filter: blur(8px);
    }

    .icon-circle.small {
      width: 44px;
      height: 44px;
    }

    .icon-circle svg {
      width: 26px;
      height: 26px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .hero {
      text-align: center;
      padding-top: 10px;
    }

    .hero h1,
    .screen-title {
      margin: 0;
      font-size: 30px;
      letter-spacing: 4px;
      font-weight: 500;
      color: #7a4816;
      text-shadow: 0 1px 0 rgba(255,255,255,0.35);
    }

    .divider {
      width: 176px;
      margin: 12px auto 18px;
      opacity: 0.86;
    }

    .hero-copy,
    .screen-subtitle {
      text-align: center;
      margin: 0 auto;
      max-width: 360px;
      color: var(--ink-soft);
      line-height: 1.9;
      font-size: 15px;
    }

    .question-card {
      margin-top: 18px;
      padding: 18px;
      border-radius: 28px;
      background: rgba(255, 249, 241, 0.4);
      border: 1px solid rgba(181, 129, 47, 0.18);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .question-shell {
      position: relative;
      min-height: 112px;
      background: url("./assets/manifestation-ui-kit/ui-kit/prompt-question-pill.png") center / 100% 100% no-repeat;
      display: flex;
      align-items: stretch;
      padding: 18px 20px;
    }

    .question-shell textarea {
      width: 100%;
      min-height: 72px;
      border: none;
      outline: none;
      resize: none;
      background: transparent;
      color: var(--ink);
      font: 400 18px/1.7 "PingFang TC", "Noto Sans TC", sans-serif;
      padding-right: 54px;
    }

    .question-shell textarea::placeholder {
      color: rgba(165, 121, 61, 0.46);
    }

    .question-feather {
      position: absolute;
      right: 18px;
      bottom: 20px;
      color: rgba(208, 169, 107, 0.9);
      pointer-events: none;
    }

    .question-feather svg {
      width: 28px;
      height: 28px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .intent-bar {
      margin-top: 18px;
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .intent-bar::-webkit-scrollbar { display: none; }

    .intent-chip {
      flex: 0 0 auto;
      border-radius: 999px;
      padding: 11px 18px;
      border: 1px solid rgba(184, 130, 42, 0.34);
      background: rgba(255, 249, 241, 0.78);
      color: var(--ink);
      font: 500 14px/1 "PingFang TC", "Noto Sans TC", sans-serif;
      box-shadow: 0 6px 18px rgba(111, 71, 19, 0.08);
      cursor: pointer;
      white-space: nowrap;
    }

    .intent-chip.active {
      color: #fff8ef;
      border-color: transparent;
      background: linear-gradient(180deg, #dc8e37, #bd571b);
      box-shadow: 0 12px 28px rgba(170, 79, 20, 0.24);
    }

    .deck-stage {
      margin-top: 28px;
      text-align: center;
    }

    .deck-card {
      position: relative;
      width: 214px;
      height: 320px;
      margin: 0 auto;
      border-radius: 24px;
      cursor: pointer;
      background:
        radial-gradient(circle at center, rgba(255, 227, 150, 0.24), transparent 42%),
        linear-gradient(180deg, rgba(178, 88, 31, 0.88), rgba(132, 50, 17, 0.94)),
        url("./assets/original-card-background.png") center / cover no-repeat;
      box-shadow:
        0 20px 48px rgba(141, 84, 19, 0.28),
        0 0 0 1px rgba(255, 227, 161, 0.32) inset;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      animation: float 4.8s ease-in-out infinite;
    }

    .deck-card:hover {
      transform: translateY(-2px);
      box-shadow:
        0 26px 54px rgba(141, 84, 19, 0.32),
        0 0 0 1px rgba(255, 227, 161, 0.36) inset;
    }

    .deck-card::before {
      content: "";
      position: absolute;
      inset: 14px;
      border-radius: 16px;
      border: 1px solid rgba(255, 234, 180, 0.42);
      opacity: 0.95;
    }

    .deck-card::after {
      content: "S";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: rgba(255, 239, 203, 0.9);
      font-size: 88px;
      text-shadow: 0 6px 26px rgba(255, 234, 181, 0.4);
    }

    .deck-ring {
      position: absolute;
      inset: auto 50% -24px;
      transform: translateX(-50%);
      width: 280px;
      height: 280px;
      border-radius: 50%;
      border: 1px solid rgba(240, 208, 146, 0.22);
      box-shadow: 0 0 0 22px rgba(245, 214, 161, 0.06), 0 0 0 44px rgba(245, 214, 161, 0.03);
      pointer-events: none;
    }

    .deck-note {
      margin-top: 22px;
      color: rgba(122, 72, 22, 0.82);
      font-size: 14px;
      line-height: 1.8;
    }

    .main-cta {
      margin-top: 20px;
      display: block;
      width: min(100%, 390px);
      margin-inline: auto;
      padding: 0;
      border: none;
      background: none;
      cursor: pointer;
    }

    .main-cta img,
    .secondary-cta img,
    .action-asset img,
    .result-action img {
      display: block;
      width: 100%;
      height: auto;
      pointer-events: none;
    }

    .home-footer-note {
      margin-top: 10px;
      text-align: center;
      color: rgba(126, 79, 22, 0.82);
      font-size: 14px;
    }

    .secondary-cta {
      margin-top: 14px;
      display: block;
      width: min(100%, 390px);
      margin-inline: auto;
      padding: 0;
      border: none;
      background: none;
      cursor: pointer;
    }

    .ritual-stats {
      margin-top: 18px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .ritual-stat {
      padding: 12px 10px;
      border-radius: 18px;
      background: rgba(255, 249, 241, 0.72);
      border: 1px solid rgba(181, 129, 47, 0.14);
      box-shadow: 0 10px 22px rgba(126, 79, 22, 0.08);
      text-align: center;
    }

    .ritual-stat strong {
      display: block;
      color: var(--ink);
      font: 700 18px/1.1 "PingFang TC", "Noto Sans TC", sans-serif;
      margin-bottom: 5px;
    }

    .ritual-stat span {
      color: rgba(107, 67, 23, 0.58);
      font: 500 11px/1.2 "PingFang TC", "Noto Sans TC", sans-serif;
      letter-spacing: 1.2px;
    }

    .journal {
      margin-top: 22px;
      padding: 18px;
      border-radius: 24px;
      background: rgba(255, 249, 241, 0.56);
      border: 1px solid rgba(181, 129, 47, 0.14);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .journal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      color: rgba(122, 72, 22, 0.78);
      font-size: 14px;
    }

    .journal-list {
      display: grid;
      gap: 10px;
    }

    .journal-entry,
    .journal-empty {
      padding: 14px;
      border-radius: 18px;
      background: rgba(255,255,255,0.42);
      border: 1px solid rgba(181, 129, 47, 0.12);
      box-shadow: 0 8px 20px rgba(126, 79, 22, 0.06);
    }

    .journal-entry strong {
      display: block;
      margin-bottom: 6px;
      font-size: 17px;
      font-weight: 500;
    }

    .journal-entry p,
    .journal-empty {
      margin: 0;
      color: rgba(107, 67, 23, 0.8);
      line-height: 1.8;
      font-size: 14px;
    }

    .journal-meta {
      margin-top: 8px;
      color: rgba(107, 67, 23, 0.52);
      font-size: 12px;
    }

    .screen-header {
      text-align: center;
      margin-bottom: 8px;
    }

    .search-wrap {
      position: relative;
      margin-top: 20px;
      background: rgba(255, 248, 236, 0.66);
      border: 1px solid rgba(181, 129, 47, 0.18);
      border-radius: 999px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .search-wrap input {
      width: 100%;
      height: 82px;
      padding: 0 70px 0 72px;
      border: none;
      background: transparent;
      color: var(--ink);
      font: 400 18px/1 "PingFang TC", "Noto Sans TC", sans-serif;
      outline: none;
    }

    .search-wrap input::placeholder {
      color: rgba(165, 121, 61, 0.46);
    }

    .search-icon,
    .search-feather {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(190, 137, 46, 0.9);
      pointer-events: none;
    }

    .search-icon { left: 22px; }
    .search-feather { right: 22px; }

    .search-icon svg,
    .search-feather svg {
      width: 28px;
      height: 28px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .filter-row {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 16px 0 2px;
      scrollbar-width: none;
    }

    .filter-row::-webkit-scrollbar { display: none; }

    .filter-chip {
      flex: 0 0 auto;
      min-width: 90px;
      padding: 12px 18px;
      border-radius: 999px;
      border: 1px solid rgba(181, 129, 47, 0.34);
      background: rgba(255, 250, 242, 0.8);
      box-shadow: 0 8px 18px rgba(120, 78, 22, 0.08);
      color: var(--ink);
      font: 500 14px/1 "PingFang TC", "Noto Sans TC", sans-serif;
      text-align: center;
      cursor: pointer;
      white-space: nowrap;
    }

    .filter-chip.active {
      background: linear-gradient(180deg, #d27f2c, #b4501b);
      color: #fff8ed;
      border-color: transparent;
    }

    .library-grid {
      margin-top: 18px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .library-card {
      border: none;
      background: none;
      padding: 0;
      text-align: left;
      cursor: pointer;
    }

    .library-card-visual {
      position: relative;
      border-radius: 22px;
      overflow: hidden;
      padding: 14px 14px 18px;
      min-height: 250px;
      background:
        linear-gradient(180deg, rgba(255, 224, 151, 0.2), rgba(153, 74, 20, 0.14)),
        url("./assets/original-card-background.png") center / cover no-repeat;
      border: 2px solid rgba(216, 155, 70, 0.72);
      box-shadow: 0 18px 28px rgba(129, 74, 18, 0.16);
    }

    .library-card-visual::before {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 14px;
      border: 1px solid rgba(255, 238, 210, 0.48);
      pointer-events: none;
    }

    .card-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255, 247, 233, 0.76);
      color: rgba(132, 80, 25, 0.92);
      font: 600 11px/1 "PingFang TC", "Noto Sans TC", sans-serif;
      letter-spacing: 1px;
    }

    .card-symbol {
      height: 92px;
      display: grid;
      place-items: center;
      color: rgba(255, 250, 236, 0.95);
      font-size: 48px;
      text-shadow: 0 4px 24px rgba(255, 241, 214, 0.4);
    }

    .library-card-title {
      margin-top: 8px;
      text-align: center;
      color: rgba(108, 65, 19, 0.96);
      font-size: 15px;
      line-height: 1.5;
      font-weight: 500;
    }

    .library-card-preview {
      margin-top: 8px;
      color: rgba(107, 67, 23, 0.74);
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }

    .result-wrap {
      padding-top: 2px;
    }

    .result-card-frame {
      margin: 20px auto 18px;
      width: min(100%, 380px);
      border-radius: 36px;
      padding: 18px;
      background: linear-gradient(180deg, rgba(241, 103, 156, 0.9), rgba(220, 61, 124, 0.92));
      box-shadow: 0 22px 50px rgba(124, 52, 75, 0.22);
    }

    .result-card {
      border-radius: 28px;
      padding: 30px 26px 34px;
      min-height: 540px;
      background:
        radial-gradient(circle at center, rgba(255,255,255,0.92), rgba(255,255,255,0.78) 34%, rgba(255, 234, 181, 0.26) 70%, transparent 100%),
        url("./assets/original-card-background.png") center / cover no-repeat;
      border: 4px solid rgba(242, 209, 118, 0.96);
      color: #553013;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .result-card::before {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 20px;
      border: 1px solid rgba(118, 74, 27, 0.22);
      pointer-events: none;
    }

    .result-card h2 {
      margin: 0;
      font-size: 28px;
      line-height: 1.36;
      font-weight: 500;
      position: relative;
      z-index: 1;
    }

    .result-card-body {
      margin-top: 22px;
      white-space: pre-wrap;
      line-height: 1.9;
      font-size: 17px;
      position: relative;
      z-index: 1;
    }

    .result-question {
      margin: 0 auto;
      max-width: 390px;
      text-align: center;
      color: rgba(107, 67, 23, 0.78);
      font-size: 15px;
      line-height: 1.8;
    }

    .guidance-panel {
      margin-top: 16px;
      background: rgba(255, 249, 241, 0.84);
      border-radius: 24px;
      padding: 16px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(181, 129, 47, 0.14);
    }

    .guidance-panel strong {
      display: block;
      text-align: center;
      font-size: 16px;
      letter-spacing: 2px;
      font-weight: 500;
      margin-bottom: 10px;
    }

    .guidance-panel p {
      margin: 0;
      color: rgba(107, 67, 23, 0.84);
      line-height: 1.9;
      font-size: 15px;
      text-align: center;
    }

    .result-actions {
      margin-top: 18px;
      display: grid;
      gap: 12px;
    }

    .result-action,
    .action-asset {
      display: block;
      width: 100%;
      border: none;
      background: none;
      padding: 0;
      cursor: pointer;
    }

    .save-feedback {
      text-align: center;
      color: rgba(107, 67, 23, 0.72);
      font-size: 13px;
      min-height: 18px;
      margin-top: 2px;
    }

    .library-empty {
      padding: 22px 16px;
      text-align: center;
      border-radius: 22px;
      background: rgba(255, 250, 242, 0.74);
      border: 1px solid rgba(181, 129, 47, 0.16);
      color: rgba(107, 67, 23, 0.72);
      line-height: 1.8;
      box-shadow: var(--shadow);
    }

    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      width: calc(var(--screen-w) - 28px);
      max-width: 452px;
      padding: 10px 18px calc(10px + var(--safe-bottom));
      border-radius: 30px;
      background: rgba(255, 248, 236, 0.9);
      border: 1px solid rgba(191, 138, 58, 0.18);
      box-shadow: 0 18px 40px rgba(104, 69, 18, 0.16);
      backdrop-filter: blur(14px);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      z-index: 20;
    }

    .nav-btn {
      position: relative;
      border: none;
      background: none;
      color: rgba(132, 82, 24, 0.88);
      font: 500 13px/1.3 "PingFang TC", "Noto Sans TC", sans-serif;
      padding: 10px 6px 4px;
      display: grid;
      justify-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .nav-btn svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .nav-btn.active {
      color: #a35619;
    }

    .nav-btn.draw.active::before,
    .nav-btn.draw::before {
      content: "";
      position: absolute;
      top: -26px;
      width: 66px;
      height: 66px;
      border-radius: 50%;
      background: linear-gradient(180deg, #db8c35, #bf591b);
      border: 6px solid rgba(255, 248, 236, 0.96);
      box-shadow: 0 16px 30px rgba(142, 77, 19, 0.22);
      z-index: -1;
    }

    .nav-btn.draw {
      color: #fff7ec;
      padding-top: 0;
    }

    .nav-btn.draw svg {
      margin-top: -18px;
      stroke: #fff7ec;
    }

    .nav-btn.draw span {
      color: #8f4e17;
      margin-top: 20px;
      font-weight: 600;
    }

    .loading-cover {
      position: fixed;
      inset: 0;
      background: rgba(255, 247, 236, 0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 80;
      transition: opacity 0.3s ease;
    }

    .loading-cover.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-card {
      text-align: center;
      padding: 26px 24px;
      border-radius: 26px;
      background: rgba(255,255,255,0.7);
      box-shadow: var(--shadow);
      border: 1px solid rgba(181, 129, 47, 0.12);
    }

    .loading-card .pulse {
      width: 72px;
      height: 72px;
      margin: 0 auto 14px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(238, 177, 69, 0.94), rgba(199, 103, 32, 0.92));
      animation: pulse 1.4s ease-in-out infinite;
    }

    .loading-card p {
      margin: 0;
      color: rgba(107, 67, 23, 0.78);
      line-height: 1.8;
    }

    .shake {
      animation: shake 0.7s ease;
    }

    .rise-in {
      animation: riseIn 0.55s ease;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-14px); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(0.92); opacity: 0.86; }
      50% { transform: scale(1.04); opacity: 1; }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0) rotate(0); }
      20% { transform: translateX(-4px) rotate(-1deg); }
      40% { transform: translateX(4px) rotate(1deg); }
      60% { transform: translateX(-3px) rotate(-1deg); }
      80% { transform: translateX(3px) rotate(1deg); }
    }

    @keyframes riseIn {
      from { opacity: 0; transform: translateY(22px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (max-width: 380px) {
      .screen {
        padding-inline: 12px;
      }

      .hero h1,
      .screen-title {
        font-size: 28px;
      }

      .library-grid {
        gap: 12px;
      }

      .library-card-visual {
        min-height: 246px;
        padding-inline: 12px;
      }

      .result-card {
        padding-inline: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div id="loading-cover" class="loading-cover">
      <div class="loading-card">
        <div class="pulse"></div>
        <p>正在打開祕密實現卡…</p>
      </div>
    </div>

    <section id="screen-home" class="screen active">
      <div class="top-actions">
        <div class="icon-circle small" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"></path></svg>
        </div>
        <button id="profile-btn" class="icon-circle" type="button" aria-label="個人設定">

          <path d="M120 5l2.6 6.4L129 14l-6.4 2.6L120 23l-2.6-6.4L111 14l6.4-2.6Z" fill="rgba(176,124,38,0.68)"></path>

  <script>
    const db = { cards: [] };
    const journalKey = 'secret_manifestation_ritual_journal_v2';
    const state = {
      screen: 'home',
      activeIntent: 'all',
      currentCard: null,
      drawCount: 0,
      search: ''
    };

    const filters = [
      { id: 'all', label: '全部' },
      { id: 'wealth', label: '豐盛' },
      { id: 'love', label: '愛情' },
      { id: 'career', label: '事業' },
      { id: 'health', label: '健康' },
      { id: 'daily', label: '日常提醒' }
    ];

    const intentCopy = {
      all: '今日呢張牌，唔需要你追趕答案，只需要你聽清楚自己真正想要靠近嘅方向。',
      wealth: '豐盛唔只係金錢，而係你願唔願意相信自己值得接收。今日先把心打開。',
      love: '關係真正要被照亮嘅，通常唔係對方，而係你內心最深嗰層渴望同需要。',
      career: '你要走嘅路唔一定最吵，但一定會令你內在更穩。留意真正令你有力量嘅選擇。',
      health: '身心訊號一向誠實。今日先溫柔啲，問自己：我而家最需要照顧邊一部分？',
      daily: '當你唔知由邊度開始，就先由今日開始。將一個細小而正面嘅念頭留低。'
    };

    const reflectionCopy = {
      all: '此刻，你最想把注意力放在什麼美好之上？',
      wealth: '如果你已經值得豐盛，今日你會點樣對待自己？',
      love: '你想吸引嘅愛，今日可唔可以先由你自己身上開始？',
      career: '哪一個選擇，會令你更接近真正想成為的自己？',
      health: '如果你今日要溫柔照顧自己一次，會係什麼方式？',
      daily: '今日最值得感謝的一件小事是什麼？'
    };

    const categoryKeywords = {
      wealth: ['金錢', '豐盛', '財富', '充沛', '供應', '致富'],
      love: ['愛', '關係', '人際', '珍惜', '幸福', '快樂', '被愛'],
      career: ['夢想', '人生', '創造', '未來', '力量', '選擇', '願望', '實現'],
      health: ['健康', '喜悅', '心中', '心', '呼吸', '平靜', '身體', '疾病'],
      daily: ['感恩', '今天', '現在', '早晨', '提醒', '意念', '當下']
    };

    const symbols = ['✦', '✧', '✶', '✹', '❋', '❊', '✷', '✺'];

    const el = {
      loadingCover: document.getElementById('loading-cover'),
      home: document.getElementById('screen-home'),
      result: document.getElementById('screen-result'),
      library: document.getElementById('screen-library'),
      navHome: document.getElementById('nav-home'),
      navDraw: document.getElementById('nav-draw'),
      navLibrary: document.getElementById('nav-library'),
      questionInput: document.getElementById('question-input'),
      deckCard: document.getElementById('deck-card'),
      drawAction: document.getElementById('draw-action'),
      openLibraryAction: document.getElementById('open-library-action'),
      intentBar: document.getElementById('intent-bar'),
      journalList: document.getElementById('journal-list'),
      journalCount: document.getElementById('journal-count'),
      statDeckCount: document.getElementById('stat-deck-count'),
      statSavedCount: document.getElementById('stat-saved-count'),
      statIntentLabel: document.getElementById('stat-intent-label'),
      resultTitle: document.getElementById('result-title'),
      resultBody: document.getElementById('result-body'),
      resultQuestion: document.getElementById('result-question'),
      resultGuidance: document.getElementById('result-guidance'),
      resultReflection: document.getElementById('result-reflection'),
      resultCard: document.getElementById('result-card'),
      saveCardBtn: document.getElementById('save-card-btn'),
      redrawCardBtn: document.getElementById('redraw-card-btn'),
      shareRowBtn: document.getElementById('share-row-btn'),
      saveFeedback: document.getElementById('save-feedback'),
      backHomeBtn: document.getElementById('back-home-btn'),
      libraryBackBtn: document.getElementById('library-back-btn'),
      librarySearch: document.getElementById('library-search'),
      filterRow: document.getElementById('filter-row'),
      libraryGrid: document.getElementById('library-grid')
    };

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function classifyCard(card) {
      const haystack = (card.title_zh + ' ' + card.visible_text).toLowerCase();
      for (const [category, words] of Object.entries(categoryKeywords)) {
        if (words.some((word) => haystack.includes(word.toLowerCase()))) {
          return category;
        }
      }
      return 'daily';
    }

    function getJournal() {
      try {
        return JSON.parse(localStorage.getItem(journalKey) || '[]');
      } catch {
        return [];
      }
    }

    function saveJournal(entries) {
      localStorage.setItem(journalKey, JSON.stringify(entries));
    }

    function renderIntents() {
      el.intentBar.innerHTML = filters.map((filter) => {
        const active = state.activeIntent === filter.id ? ' active' : '';
        return `<button class="intent-chip${active}" type="button" data-intent="${filter.id}">${filter.label}</button>`;
      }).join('');
      Array.from(el.intentBar.querySelectorAll('.intent-chip')).forEach((button) => {
        button.addEventListener('click', () => {
          state.activeIntent = button.dataset.intent;
          renderIntents();
          renderJournal();
        });
      });
    }

    function renderFilters() {
      el.filterRow.innerHTML = filters.map((filter) => {
        const active = state.activeIntent === filter.id ? ' active' : '';
        return `<button class="filter-chip${active}" type="button" data-filter="${filter.id}">${filter.label}</button>`;
      }).join('');
      Array.from(el.filterRow.querySelectorAll('.filter-chip')).forEach((button) => {
        button.addEventListener('click', () => {
          state.activeIntent = button.dataset.filter;
          renderIntents();
          renderFilters();
          renderJournal();
          renderLibrary();
        });
      });
    }

    function setScreen(screen) {
      state.screen = screen;
      el.home.classList.toggle('active', screen === 'home');
      el.result.classList.toggle('active', screen === 'result');
      el.library.classList.toggle('active', screen === 'library');
      el.navHome.classList.toggle('active', screen === 'home');
      el.navLibrary.classList.toggle('active', screen === 'library');
      el.navDraw.classList.toggle('active', screen !== 'library');
      if (screen === 'library') {
        renderLibrary();
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderJournal() {
      const entries = getJournal();
      el.journalCount.textContent = `${entries.length} 張`;
      el.statSavedCount.textContent = String(entries.length);
      el.statDeckCount.textContent = String(db.cards.length);
      el.statIntentLabel.textContent = filters.find((item) => item.id === state.activeIntent)?.label || '全部';
      if (!entries.length) {
        el.journalList.innerHTML = "<div class='journal-empty'>你收藏嘅訊息會出現在呢度。抽到有感覺嘅一張，就按「收藏這張牌」。</div>";
        return;
      }
      el.journalList.innerHTML = entries.slice(0, 3).map((entry) => {
        const question = entry.question
          ? `你問的是：「${escapeHtml(entry.question)}」`
          : '你當時未有寫下問題，只係純粹接收當下訊息。';
        return [
          "<div class='journal-entry'>",
          `<strong>${escapeHtml(entry.title)}</strong>`,
          `<p>${question}</p>`,
          `<div class='journal-meta'>${escapeHtml(entry.intentLabel)} · ${escapeHtml(entry.time)}</div>`,
          "</div>"
        ].join('');
      }).join('');
    }

    function buildReflection(card) {
      const question = (el.questionInput.value || '').trim();
      const base = reflectionCopy[state.activeIntent] || reflectionCopy.daily;
      if (!question) return base;
      return `${base}\n\n你起初問的是：「${question}」`;
    }

    function showResult(card, fromLibrary = false) {
      const question = (el.questionInput.value || '').trim();
      const guidance = fromLibrary
        ? '把注意力停留喺呢句話上，睇下邊一段最刺中你，嗰度通常就係而家最需要被看見嘅位置。'
        : (intentCopy[state.activeIntent] || intentCopy.daily);

      state.currentCard = {
        id: card.id,
        title: card.title_zh,
        text: card.visible_text,
        question,
        intent: state.activeIntent,
        intentLabel: filters.find((item) => item.id === state.activeIntent)?.label || '全部',
        time: new Date().toLocaleString('zh-Hant-HK', { hour12: false })
      };

      el.resultTitle.textContent = card.title_zh;
      el.resultBody.textContent = card.visible_text;
      el.resultQuestion.textContent = question
        ? `你問的是：「${question}」`
        : '你冇特別寫下問題，所以宇宙回應的是你此刻整體的狀態。';
      el.resultGuidance.textContent = guidance;
      el.resultReflection.textContent = buildReflection(card);
      el.saveFeedback.textContent = '';
      el.resultCard.classList.remove('rise-in');
      void el.resultCard.offsetWidth;
      el.resultCard.classList.add('rise-in');
      setScreen('result');
    }

    function getFilteredCards() {
      const query = state.search.trim().toLowerCase();
      return db.cards.filter((card) => {
        const matchesFilter = state.activeIntent === 'all' || card.category === state.activeIntent;
        if (!matchesFilter) return false;
        if (!query) return true;
        return `${card.title_zh} ${card.visible_text}`.toLowerCase().includes(query);
      });
    }

    function renderLibrary() {
      const cards = getFilteredCards();
      if (!cards.length) {
        el.libraryGrid.innerHTML = "<div class='library-empty' style='grid-column: 1 / -1;'>暫時搵唔到相符嘅卡牌。試下換個關鍵字，或者切返其他主題。</div>";
        return;
      }
      el.libraryGrid.innerHTML = cards.map((card, index) => {
        const preview = escapeHtml(card.visible_text.slice(0, 36)) + (card.visible_text.length > 36 ? '…' : '');
        const symbol = symbols[index % symbols.length];
        const badge = filters.find((filter) => filter.id === card.category)?.label || '日常';
        return [
          `<button class="library-card" type="button" data-card-id="${escapeHtml(card.id)}">`,
          "<div class='library-card-visual'>",
          `<div class="card-badge">${escapeHtml(badge)}</div>`,
          `<div class="card-symbol">${symbol}</div>`,
          `<div class="library-card-title">${escapeHtml(card.title_zh)}</div>`,
          `<div class="library-card-preview">${preview}</div>`,
          "</div>",
          "</button>"
        ].join('');
      }).join('');

      Array.from(el.libraryGrid.querySelectorAll('.library-card')).forEach((button) => {
        button.addEventListener('click', () => {
          const card = db.cards.find((item) => item.id === button.dataset.cardId);
          if (card) showResult(card, true);
        });
      });
    }

    function drawCard() {
      const pool = db.cards.filter((card) => state.activeIntent === 'all' || card.category === state.activeIntent);
      const cards = pool.length ? pool : db.cards;
      if (!cards.length) return;
      state.drawCount += 1;
      el.deckCard.classList.remove('shake');
      void el.deckCard.offsetWidth;
      el.deckCard.classList.add('shake');
      window.setTimeout(() => {
        const card = cards[Math.floor(Math.random() * cards.length)];
        showResult(card);
      }, 560);
    }

    function saveCurrentCard() {
      if (!state.currentCard) return;
      const entries = getJournal();
      const exists = entries.some((entry) => entry.id === state.currentCard.id && entry.time === state.currentCard.time);
      if (!exists) {
        entries.unshift(state.currentCard);
        saveJournal(entries.slice(0, 18));
      }
      renderJournal();
      el.saveFeedback.textContent = '已收藏到你的顯化紀錄。';
    }

    async function shareCurrentCard() {
      if (!state.currentCard) return;
      const payload = [
        state.currentCard.title,
        '',
        state.currentCard.text,
        '',
        state.currentCard.question ? `你問的是：${state.currentCard.question}` : '你以直覺接收了這張牌。'
      ].join('\n');
      if (navigator.share) {
        try {
          await navigator.share({ title: state.currentCard.title, text: payload });
          return;
        } catch {}
      }
      try {
        await navigator.clipboard.writeText(payload);
        el.saveFeedback.textContent = '牌卡內容已複製，可以直接分享。';
      } catch {
        el.saveFeedback.textContent = '分享功能未完成，但你可以手動複製內容。';
      }
    }

    function bindEvents() {
      el.navHome.addEventListener('click', () => setScreen('home'));
      el.navDraw.addEventListener('click', () => setScreen('home'));
      el.navLibrary.addEventListener('click', () => setScreen('library'));
      el.backHomeBtn.addEventListener('click', () => setScreen('home'));
      el.libraryBackBtn.addEventListener('click', () => setScreen('home'));
      el.drawAction.addEventListener('click', drawCard);
      el.openLibraryAction.addEventListener('click', () => setScreen('library'));
      el.deckCard.addEventListener('click', drawCard);
      el.deckCard.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          drawCard();
        }
      });
      el.saveCardBtn.addEventListener('click', saveCurrentCard);
      el.redrawCardBtn.addEventListener('click', drawCard);
      el.shareRowBtn.addEventListener('click', shareCurrentCard);
      el.librarySearch.addEventListener('input', () => {
        state.search = el.librarySearch.value || '';
        renderLibrary();
      });
    }

    async function loadDatabase() {
      const response = await fetch('./database/cards.json', { cache: 'no-store' });
      if (!response.ok) throw new Error(`Failed to load cards: ${response.status}`);
      const payload = await response.json();
      db.cards = (payload.cards || []).map((card) => ({
        ...card,
        category: classifyCard(card)
      }));
    }

    async function init() {
      bindEvents();
      renderIntents();
      renderFilters();
      renderJournal();
      try {
        await loadDatabase();
        renderLibrary();
      } finally {
        window.setTimeout(() => {
          el.loadingCover.classList.add('hidden');
        }, 280);
      }
    }

    init();
  </script>
</body>
</html>
