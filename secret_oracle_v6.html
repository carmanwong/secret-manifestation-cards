<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>祕密顯化指引卡</title>
  <style>
    :root {
      --bg: #0f0607;
      --bg-2: #1f0d10;
      --panel: rgba(38, 15, 17, 0.82);
      --panel-border: rgba(212, 175, 55, 0.2);
      --gold: #d4af37;
      --gold-soft: #f3dfa0;
      --text: #fff6de;
      --muted: rgba(255, 246, 222, 0.68);
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at top, rgba(139, 42, 31, 0.45), transparent 32%),
        radial-gradient(circle at 50% 25%, rgba(212, 175, 55, 0.08), transparent 30%),
        linear-gradient(180deg, var(--bg-2), var(--bg));
      color: var(--text);
      font-family: "Baskerville", "Times New Roman", "PingFang TC", serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.08) 0 1px, transparent 2px),
        radial-gradient(circle at 80% 18%, rgba(255,255,255,0.06) 0 1px, transparent 2px),
        radial-gradient(circle at 62% 72%, rgba(255,255,255,0.05) 0 1px, transparent 2px);
      background-size: 180px 180px, 220px 220px, 260px 260px;
      opacity: 0.45;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      justify-content: center;
      padding: 18px 16px 0;
    }

    .mode-switch {
      display: inline-flex;
      gap: 6px;
      padding: 6px;
      border-radius: 999px;
      background: rgba(15, 8, 8, 0.74);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(16px);
    }

    .mode-btn {
      border: none;
      border-radius: 999px;
      padding: 10px 18px;
      background: transparent;
      color: rgba(255, 246, 222, 0.55);
      cursor: pointer;
      letter-spacing: 1.4px;
      font-size: 13px;
    }

    .mode-btn.active {
      background: linear-gradient(180deg, var(--gold-soft), var(--gold));
      color: #2b1609;
      font-weight: 700;
    }

    .screen {
      width: min(100%, 460px);
      margin: 0 auto;
      padding: 24px 18px 48px;
    }

    .brand {
      text-align: center;
      padding-top: 26px;
    }

    .sigil {
      width: 92px;
      height: 92px;
      margin: 0 auto 20px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      border: 2px solid rgba(212, 175, 55, 0.75);
      background: radial-gradient(circle at 35% 30%, #a93127, #641412 70%);
      box-shadow: 0 0 36px rgba(212, 175, 55, 0.22), inset 0 0 22px rgba(0, 0, 0, 0.45);
      position: relative;
    }

    .sigil::before {
      content: "";
      position: absolute;
      inset: -8px;
      border: 1px dashed rgba(212, 175, 55, 0.35);
      border-radius: 50%;
      animation: spin 18s linear infinite;
    }

    .sigil span {
      font-size: 42px;
      color: var(--gold);
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.6);
    }

    h1 {
      margin: 0;
      font-size: 42px;
      letter-spacing: 8px;
      background: linear-gradient(180deg, #fff7dc, #d4af37 72%, #9f7a20);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      margin: 14px auto 0;
      max-width: 340px;
      color: var(--muted);
      line-height: 1.8;
      font-size: 15px;
    }

    .panel {
      margin-top: 16px;
      background: linear-gradient(180deg, rgba(56, 18, 20, 0.88), rgba(20, 7, 8, 0.94));
      border: 1px solid var(--panel-border);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 18px;
      backdrop-filter: blur(16px);
    }

    .label {
      display: block;
      margin-bottom: 10px;
      color: var(--gold-soft);
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    textarea {
      width: 100%;
      min-height: 96px;
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 18px;
      background: rgba(255,255,255,0.04);
      color: var(--text);
      resize: none;
      outline: none;
      padding: 14px 16px;
      font-size: 16px;
      line-height: 1.65;
      font-family: "PingFang TC", "Noto Sans TC", sans-serif;
    }

    textarea:focus {
      border-color: rgba(212, 175, 55, 0.55);
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
    }

    .intent-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .intent-chip {
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 999px;
      background: rgba(255,255,255,0.04);
      color: rgba(255, 246, 222, 0.84);
      padding: 11px 14px;
      font-size: 13px;
      cursor: pointer;
      font-family: "PingFang TC", "Noto Sans TC", sans-serif;
    }

    .intent-chip.active {
      background: linear-gradient(180deg, rgba(244, 221, 151, 0.22), rgba(212, 175, 55, 0.2));
      border-color: rgba(244, 221, 151, 0.56);
      color: #fff9e5;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.24);
      transform: translateY(-1px);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 16px;
    }

    .stat {
      text-align: center;
      border-radius: 18px;
      padding: 14px 10px;
      background: rgba(255,255,255,0.035);
      border: 1px solid rgba(212, 175, 55, 0.15);
    }

    .stat strong {
      display: block;
      font: 700 20px/1 "PingFang TC", sans-serif;
      margin-bottom: 4px;
      color: #fff4d0;
    }

    .stat span {
      color: rgba(255, 246, 222, 0.54);
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .deck-wrap {
      display: grid;
      place-items: center;
      margin-top: 20px;
      gap: 14px;
    }

    .deck {
      width: 214px;
      height: 320px;
      border-radius: 18px;
      position: relative;
      cursor: pointer;
      background: linear-gradient(135deg, #92261f, #5b1310 68%);
      border: 2px solid rgba(212, 175, 55, 0.84);
      box-shadow:
        0 24px 50px rgba(0,0,0,0.56),
        0 8px 0 #4e100d,
        0 12px 0 #a27b1b;
      overflow: hidden;
      animation: float 4.4s ease-in-out infinite;
    }

    .deck::before {
      content: "";
      position: absolute;
      inset: 12px;
      border-radius: 10px;
      border: 1px solid rgba(212, 175, 55, 0.24);
    }

    .deck::after {
      content: "";
      position: absolute;
      inset: -20%;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.18), transparent 55%);
      z-index: -1;
      animation: glow 2.8s ease-in-out infinite alternate;
    }

    .deck-text {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--gold);
      font-size: 34px;
      letter-spacing: 10px;
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.72);
    }

    .draw-btn {
      width: 100%;
      border: none;
      border-radius: 999px;
      padding: 16px 18px;
      cursor: pointer;
      background: linear-gradient(180deg, var(--gold-soft), var(--gold));
      color: #2a170b;
      font-weight: 700;
      letter-spacing: 2px;
      box-shadow: 0 16px 34px rgba(0, 0, 0, 0.26);
    }

    .note, .question-pill {
      text-align: center;
      color: rgba(255, 246, 222, 0.58);
      font-size: 12px;
      letter-spacing: 1.4px;
      line-height: 1.7;
    }

    .question-pill {
      min-height: 20px;
      color: rgba(255, 246, 222, 0.72);
    }

    .journal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      color: var(--gold-soft);
    }

    .journal-list {
      display: grid;
      gap: 10px;
    }

    .journal-item, .journal-empty {
      border-radius: 18px;
      padding: 14px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(212, 175, 55, 0.12);
    }

    .journal-title {
      font-size: 17px;
      margin-bottom: 6px;
      color: #fff4ce;
    }

    .journal-question {
      color: rgba(255, 246, 222, 0.72);
      line-height: 1.7;
      font-size: 14px;
    }

    .journal-meta {
      margin-top: 8px;
      color: rgba(255, 246, 222, 0.46);
      font-size: 12px;
    }

    #library-view { display: none; }

    .library-head {
      text-align: center;
      padding-top: 22px;
    }

    .library-grid {
      margin-top: 18px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .library-card {
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(60, 17, 20, 0.9), rgba(18, 7, 8, 0.96));
      border: 2px solid var(--card-border, rgba(212, 175, 55, 0.8));
      box-shadow: var(--shadow);
      padding: 16px;
      cursor: pointer;
    }

    .library-card h3 {
      margin: 0 0 10px;
      font-size: 22px;
      color: #fff5d7;
    }

    .library-card p {
      margin: 0;
      color: rgba(255, 246, 222, 0.8);
      line-height: 1.7;
      font-size: 14px;
    }

    .loading, .error {
      margin-top: 18px;
      text-align: center;
      color: var(--muted);
    }

    #overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(7, 3, 4, 0.84);
      backdrop-filter: blur(14px);
      z-index: 50;
    }

    .overlay-stack {
      width: min(100%, 420px);
      display: grid;
      gap: 14px;
      justify-items: center;
    }

    .active-card {
      width: 100%;
      border-radius: 30px;
      background: linear-gradient(180deg, #f9f1d7, #f2e4bd);
      border: 6px solid var(--card-border, #d4af37);
      color: #3b2616;
      padding: 28px 22px;
      box-shadow: 0 24px 54px rgba(0,0,0,0.42);
      transform-origin: center;
    }

    .active-card h2 {
      margin: 0 0 14px;
      font-size: 32px;
      line-height: 1.24;
      text-align: center;
    }

    .card-text {
      white-space: pre-wrap;
      line-height: 1.9;
      font-size: 18px;
      text-align: center;
    }

    .overlay-question, .guidance {
      text-align: center;
      color: rgba(255, 246, 222, 0.84);
      line-height: 1.8;
    }

    .actions {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn {
      border-radius: 999px;
      padding: 14px 16px;
      font-size: 15px;
      cursor: pointer;
    }

    .btn-outline {
      background: transparent;
      color: var(--gold-soft);
      border: 1px solid rgba(212, 175, 55, 0.5);
    }

    .btn-gold {
      border: none;
      background: linear-gradient(180deg, var(--gold-soft), var(--gold));
      color: #2a170b;
      font-weight: 700;
    }

    .shake { animation: shuffle 0.55s linear 2; }
    .flip { animation: flipIn 0.55s ease; }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-14px); }
    }

    @keyframes glow {
      0% { transform: scale(0.9); opacity: 0.45; }
      100% { transform: scale(1.08); opacity: 0.95; }
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    @keyframes shuffle {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(2deg) translateY(-4px); }
      75% { transform: rotate(-2deg) translateY(-4px); }
    }

    @keyframes flipIn {
      from { opacity: 0; transform: perspective(800px) rotateY(-90deg) scale(0.88); }
      to { opacity: 1; transform: perspective(800px) rotateY(0deg) scale(1); }
    }

    @media (max-width: 420px) {
      h1 { font-size: 34px; letter-spacing: 6px; }
      .active-card h2 { font-size: 28px; }
      .card-text { font-size: 17px; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="mode-switch">
      <button id="btn-oracle" class="mode-btn active" type="button">請示祕密</button>
      <button id="btn-library" class="mode-btn" type="button">館藏圖鑑</button>
    </div>
  </div>

  <main class="screen">
    <section id="oracle-view">
      <div class="brand">
        <div class="sigil"><span>祕</span></div>
        <h1>祕密</h1>
        <div class="subtitle">先寫下你此刻想問的事，再選一個意圖。抽牌唔再只係瀏覽，而係一次真正嘅顯化儀式。</div>
      </div>

      <section class="panel">
        <label class="label" for="question-input">你的問題</label>
        <textarea id="question-input" placeholder="例如：我而家最需要放低咩？"></textarea>
      </section>

      <section class="panel">
        <div class="label">今日意圖</div>
        <div class="intent-grid">
          <button class="intent-chip active" data-intent="clarity" type="button">釐清方向</button>
          <button class="intent-chip" data-intent="love" type="button">感情與關係</button>
          <button class="intent-chip" data-intent="wealth" type="button">金錢與豐盛</button>
          <button class="intent-chip" data-intent="healing" type="button">療癒與放下</button>
        </div>
      </section>

      <section class="stats">
        <div class="stat"><strong id="draw-count">0</strong><span>抽卡次數</span></div>
        <div class="stat"><strong id="saved-count">0</strong><span>已收下</span></div>
        <div class="stat"><strong id="deck-count">0</strong><span>牌庫張數</span></div>
      </section>

      <section class="deck-wrap">
        <div id="deck" class="deck" role="button" tabindex="0" aria-label="抽一張牌">
          <div class="deck-text">祕密</div>
        </div>
        <button id="draw-btn" class="draw-btn" type="button">開始抽卡</button>
        <div class="note">先靜一靜，再抽一張。每一次抽牌，都是一次新的選擇。</div>
        <div id="question-pill" class="question-pill"></div>
      </section>

      <section class="panel">
        <div class="journal-head">
          <span>我的顯化紀錄</span>
          <span>最近 3 次</span>
        </div>
        <div id="journal-list" class="journal-list">
          <div class="journal-empty">載入中...</div>
        </div>
      </section>
    </section>

    <section id="library-view">
      <div class="library-head">
        <h1>館藏圖鑑</h1>
        <div class="subtitle">全部牌卡都可以喺度直接翻開，不過主入口仍然會保留抽卡儀式感。</div>
      </div>
      <div id="library-status" class="loading">載入牌庫中...</div>
      <div id="library-grid" class="library-grid"></div>
    </section>
  </main>

  <div id="overlay">
    <div class="overlay-stack">
      <article id="active-card" class="active-card">
        <h2 id="overlay-title"></h2>
        <div id="overlay-text" class="card-text"></div>
      </article>
      <div id="overlay-question" class="overlay-question"></div>
      <div id="overlay-guidance" class="guidance"></div>
      <div class="actions">
        <button id="close-btn" class="btn btn-outline" type="button">關閉</button>
        <button id="save-btn" class="btn btn-gold" type="button">收下指引</button>
      </div>
    </div>
  </div>

  <script>
    const db = { cards: [] };
    const journalKey = 'secret_manifestation_journal_v1';
    const intentCopy = {
      clarity: '先把雜音放低。這張牌會幫你看清而家最重要嘅方向。',
      love: '把注意力帶回你的心。呢張牌會照到關係裡真正需要被愛嘅位置。',
      wealth: '豐盛先由感受開始。呢張牌會提醒你點樣同接收對齊。',
      healing: '唔需要硬撐。呢張牌會指出你此刻最需要放下或修復嘅地方。'
    };
    const colorMap = {
      green: '#3a9d5d',
      red: '#c63b43',
      pink: '#e06bb2',
      purple: '#8e62d9',
      blue_green: '#45b9c8',
      burgundy: '#7e2a35',
      blue: '#426fcf',
      light_blue: '#74d5ef',
      teal: '#28a79a',
      yellow_green: '#7fb62e',
      olive: '#a79e28',
      yellow: '#e2b62a',
      orange: '#e98f1f',
      white: '#f2ede1',
      gold: '#d4af37',
      unknown: '#d4af37'
    };

    let activeIntent = 'clarity';
    let currentDraw = null;
    let drawCount = 0;

    const els = {
      btnOracle: document.getElementById('btn-oracle'),
      btnLibrary: document.getElementById('btn-library'),
      oracleView: document.getElementById('oracle-view'),
      libraryView: document.getElementById('library-view'),
      questionInput: document.getElementById('question-input'),
      questionPill: document.getElementById('question-pill'),
      intentChips: Array.from(document.querySelectorAll('.intent-chip')),
      drawCount: document.getElementById('draw-count'),
      savedCount: document.getElementById('saved-count'),
      deckCount: document.getElementById('deck-count'),
      deck: document.getElementById('deck'),
      drawBtn: document.getElementById('draw-btn'),
      journalList: document.getElementById('journal-list'),
      libraryGrid: document.getElementById('library-grid'),
      libraryStatus: document.getElementById('library-status'),
      overlay: document.getElementById('overlay'),
      activeCard: document.getElementById('active-card'),
      overlayTitle: document.getElementById('overlay-title'),
      overlayText: document.getElementById('overlay-text'),
      overlayQuestion: document.getElementById('overlay-question'),
      overlayGuidance: document.getElementById('overlay-guidance'),
      closeBtn: document.getElementById('close-btn'),
      saveBtn: document.getElementById('save-btn')
    };

    function getJournal() {
      try {
        return JSON.parse(localStorage.getItem(journalKey) || '[]');
      } catch {
        return [];
      }
    }

    function saveJournal(entries) {
      localStorage.setItem(journalKey, JSON.stringify(entries));
    }

    function switchMode(mode) {
      const isOracle = mode === 'oracle';
      els.oracleView.style.display = isOracle ? 'block' : 'none';
      els.libraryView.style.display = isOracle ? 'none' : 'block';
      els.btnOracle.classList.toggle('active', isOracle);
      els.btnLibrary.classList.toggle('active', !isOracle);
      if (!isOracle) renderLibrary();
    }

    function chooseIntent(intent) {
      activeIntent = intent;
      els.intentChips.forEach((chip) => {
        chip.classList.toggle('active', chip.dataset.intent === intent);
      });
    }

    function updateStats() {
      els.drawCount.textContent = String(drawCount);
      els.savedCount.textContent = String(getJournal().length);
      els.deckCount.textContent = String(db.cards.length);
    }

    function renderJournal() {
      const entries = getJournal();
      updateStats();
      if (!entries.length) {
        els.journalList.innerHTML = "<div class='journal-empty'>你收下的指引會出現在呢度。抽到有感覺嘅一張，就按「收下指引」。</div>";
        return;
      }
      els.journalList.innerHTML = entries.slice(0, 3).map((entry) => {
        const q = entry.question ? "問題：" + escapeHtml(entry.question) : "未寫問題，只留下當下直覺。";
        return [
          "<div class='journal-item'>",
          "<div class='journal-title'>", escapeHtml(entry.title), "</div>",
          "<div class='journal-question'>", q, "</div>",
          "<div class='journal-meta'>", escapeHtml(entry.intentLabel), " · ", escapeHtml(entry.time), "</div>",
          "</div>"
        ].join('');
      }).join('');
    }

    function renderLibrary() {
      if (!db.cards.length) {
        els.libraryStatus.textContent = '牌庫未載入。';
        return;
      }
      els.libraryStatus.style.display = 'none';
      els.libraryGrid.innerHTML = db.cards.map((card) => {
        const preview = escapeHtml((card.visible_text || '').slice(0, 68)) + ((card.visible_text || '').length > 68 ? '...' : '');
        const border = colorMap[card.border_color] || colorMap.unknown;
        return [
          "<article class='library-card' data-card-id='", escapeHtml(card.id), "' style='--card-border:", border, "'>",
          "<h3>", escapeHtml(card.title_zh), "</h3>",
          "<p>", preview, "</p>",
          "</article>"
        ].join('');
      }).join('');
      Array.from(els.libraryGrid.querySelectorAll('.library-card')).forEach((cardEl) => {
        cardEl.addEventListener('click', () => {
          const card = db.cards.find((item) => item.id === cardEl.dataset.cardId);
          if (card) showCard(card, '館藏圖鑑', '');
        });
      });
    }

    function updateQuestionPill() {
      const question = els.questionInput.value.trim();
      els.questionPill.textContent = question ? "你此刻問的是：「" + question + "」" : '';
    }

    function drawCard() {
      if (!db.cards.length) return;
      updateQuestionPill();
      els.deck.classList.remove('shake');
      void els.deck.offsetWidth;
      els.deck.classList.add('shake');
      window.setTimeout(() => {
        const card = db.cards[Math.floor(Math.random() * db.cards.length)];
        const label = els.intentChips.find((chip) => chip.dataset.intent === activeIntent)?.textContent || '今日指引';
        currentDraw = {
          id: card.id,
          title: card.title_zh,
          question: els.questionInput.value.trim(),
          intent: activeIntent,
          intentLabel: label,
          time: new Date().toLocaleString('zh-Hant-HK', { hour12: false })
        };
        drawCount += 1;
        updateStats();
        showCard(card, intentCopy[activeIntent] || '把注意力帶返去你真正想要嘅感受。', currentDraw.question);
      }, 620);
    }

    function showCard(card, guidance, question) {
      const border = colorMap[card.border_color] || colorMap.unknown;
      els.activeCard.style.setProperty('--card-border', border);
      els.activeCard.classList.remove('flip');
      void els.activeCard.offsetWidth;
      els.activeCard.classList.add('flip');
      els.overlayTitle.textContent = card.title_zh || '';
      els.overlayText.textContent = card.visible_text || '';
      els.overlayQuestion.textContent = question ? "你問的是：「" + question + "」" : "將呢張牌當成你此刻最需要聽見嘅提醒。";
      els.overlayGuidance.textContent = guidance || '';
      els.saveBtn.textContent = '收下指引';
      els.overlay.style.display = 'flex';
    }

    function saveCurrentDraw() {
      if (!currentDraw) return;
      const entries = getJournal();
      const exists = entries.some((entry) => entry.id === currentDraw.id && entry.time === currentDraw.time);
      if (!exists) {
        entries.unshift(currentDraw);
        saveJournal(entries.slice(0, 12));
      }
      renderJournal();
      els.saveBtn.textContent = '已收下';
    }

    function closeOverlay() {
      els.overlay.style.display = 'none';
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    async function loadDatabase() {
      const response = await fetch('./database/cards.json', { cache: 'no-store' });
      if (!response.ok) {
        throw new Error('cards.json load failed: ' + response.status);
      }
      const payload = await response.json();
      db.cards = Array.isArray(payload.cards) ? payload.cards : [];
      updateStats();
      renderJournal();
    }

    function bindEvents() {
      els.btnOracle.addEventListener('click', () => switchMode('oracle'));
      els.btnLibrary.addEventListener('click', () => switchMode('library'));
      els.intentChips.forEach((chip) => {
        chip.addEventListener('click', () => chooseIntent(chip.dataset.intent));
      });
      els.questionInput.addEventListener('input', updateQuestionPill);
      els.drawBtn.addEventListener('click', drawCard);
      els.deck.addEventListener('click', drawCard);
      els.deck.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          drawCard();
        }
      });
      els.closeBtn.addEventListener('click', closeOverlay);
      els.saveBtn.addEventListener('click', saveCurrentDraw);
      els.overlay.addEventListener('click', (event) => {
        if (event.target === els.overlay) closeOverlay();
      });
    }

    async function init() {
      bindEvents();
      chooseIntent(activeIntent);
      renderJournal();
      updateStats();
      switchMode('oracle');
      try {
        await loadDatabase();
      } catch (error) {
        els.libraryStatus.className = 'error';
        els.libraryStatus.textContent = '牌庫載入失敗，請重新整理頁面。';
        els.journalList.innerHTML = "<div class='journal-empty'>牌庫未能載入，所以抽卡功能暫時停用。</div>";
        console.error(error);
      }
    }

    init();
  </script>
</body>
</html>
