<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>祕密顯化指引卡</title>
  <style>
    :root {
      --gold: #d4af37;
      --gold-light: #f4dd97;
      --paper: #f9f1d7;
      --deep-red: #721c1a;
      --ink: #2b1d16;
      --card-w: 340px;
      --card-h: 560px;
      --front-bg: url("assets/manifestation-ui-kit/frontpage-1208/frontpage-background.png");
      --front-seal: url("assets/manifestation-ui-kit/frontpage-1208/frontpage-seal-logo.png");
      --front-question-bar: url("assets/manifestation-ui-kit/frontpage-1208/frontpage-question-bar.png");
      --front-draw: url("assets/manifestation-ui-kit/frontpage-1208/frontpage-draw-button.png");
      --front-library: url("assets/manifestation-ui-kit/frontpage-1208/frontpage-library-button.png");
      --front-card-back: url("assets/manifestation-ui-kit/frontpage-1208/frontpage-card-back.png");
    }
    
    body, html {
      margin: 0; padding: 0; min-height: 100%;
      background: #f4d0a3;
      font-family: "Baskerville", "Times New Roman", "PingFang TC", serif;
      color: #52311b;
      overflow-x: hidden;
    }

    .universe {
      position: fixed; inset: 0;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0) 24%),
        var(--front-bg) center top / cover no-repeat;
      z-index: -1;
    }

    .mode-switch {
      position: fixed; top: 18px; right: 18px;
      display: flex; background: rgba(255, 248, 235, 0.74); backdrop-filter: blur(12px);
      padding: 4px; border-radius: 999px; z-index: 2000; border: 1px solid rgba(183,129,58,0.25);
      box-shadow: 0 10px 24px rgba(121, 67, 20, 0.16);
    }
    .mode-btn {
      padding: 8px 16px; border-radius: 999px; cursor: pointer; font-weight: 700; font-size: 13px;
      transition: 0.3s; border: none; background: transparent; color: rgba(108, 66, 27, 0.56);
      letter-spacing: 1px;
    }
    .mode-btn.active { background: linear-gradient(180deg, #b85e2c, #8d361b); color: #fff6e8; }

    #oracle-view {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 24px 18px; text-align: center; box-sizing: border-box;
    }

    .oracle-stage {
      width: min(100%, 440px);
      min-height: min(94vh, 860px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 24px 24px 30px;
      box-sizing: border-box;
      position: relative;
    }

    .oracle-stage::before {
      content: "";
      position: absolute;
      inset: 0;
      border: 1px solid rgba(152, 106, 43, 0.34);
      border-radius: 28px;
      pointer-events: none;
    }

    .brand-logo {
      width: 82px;
      aspect-ratio: 1;
      background: var(--front-seal) center / contain no-repeat;
      margin: 12px 0 18px;
      filter: drop-shadow(0 12px 18px rgba(120, 58, 17, 0.26));
    }

    .hero-title {
      font-size: clamp(54px, 13vw, 86px);
      line-height: 0.96;
      margin: 0;
      letter-spacing: 2px;
      color: #552510;
      text-shadow: 0 6px 18px rgba(255, 245, 230, 0.5);
    }

    .hero-divider {
      margin: 18px 0 14px;
      font-size: 30px;
      color: #d9a14f;
      line-height: 1;
    }

    .hero-subtitle {
      margin: 0 0 18px;
      font-size: clamp(18px, 4.2vw, 22px);
      color: rgba(92, 55, 22, 0.86);
      font-family: "PingFang TC", "Noto Serif TC", serif;
    }

    .deck-container {
      width: min(58vw, 230px);
      aspect-ratio: 767 / 1225;
      cursor: pointer;
      position: relative;
      margin: 4px 0 22px;
      animation: float 4s ease-in-out infinite;
      filter: drop-shadow(0 18px 28px rgba(160, 101, 41, 0.25));
    }
    .deck-container::before {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -10px;
      transform: translateX(-50%);
      width: 178%;
      height: 42%;
      background:
        radial-gradient(circle at center, rgba(255, 241, 194, 0.86) 0%, rgba(255, 241, 194, 0.18) 48%, transparent 72%);
      filter: blur(4px);
      z-index: -1;
      animation: aura-pulse 3s ease-in-out infinite alternate;
    }
    .card-pile {
      position: absolute;
      inset: 0;
      background: var(--front-card-back) center / contain no-repeat;
    }

    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
    @keyframes aura-pulse { 0% { opacity: 0.4; transform: translate(-50%, -50%) scale(0.9); } 100% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); } }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .question-shell {
      width: min(100%, 390px);
      height: 74px;
      margin-bottom: 14px;
      position: relative;
      background: var(--front-question-bar) center / 100% 100% no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .question-input {
      width: 76%;
      border: none;
      background: transparent;
      text-align: center;
      font-size: 18px;
      color: #69411d;
      font-family: "PingFang TC", "Noto Serif TC", serif;
      outline: none;
    }

    .question-input::placeholder {
      color: rgba(109, 77, 42, 0.9);
    }

    .hero-actions {
      width: min(100%, 390px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .image-button {
      width: 100%;
      padding: 0;
      border: none;
      background: transparent;
      cursor: pointer;
      display: block;
      filter: drop-shadow(0 10px 16px rgba(131, 69, 29, 0.16));
      transition: transform 0.18s ease, filter 0.18s ease;
    }

    .image-button img {
      display: block;
      width: 100%;
      height: auto;
    }

    .image-button:hover {
      transform: translateY(-1px);
      filter: drop-shadow(0 12px 18px rgba(131, 69, 29, 0.2));
    }

    .front-ornament {
      margin-top: 14px;
      font-size: 24px;
      color: rgba(203, 144, 58, 0.88);
      letter-spacing: 4px;
    }

    #library-view { display: none; padding: 120px 20px 60px; max-width: 1400px; margin: 0 auto; }
    #library-view header h1 {
      margin: 0;
      font-size: clamp(34px, 5vw, 50px);
      color: #fff1cb;
      letter-spacing: 4px;
      text-shadow: 0 10px 22px rgba(0, 0, 0, 0.42);
    }
    #library-view header p {
      margin: 12px 0 0;
      color: rgba(255, 238, 200, 0.84);
      letter-spacing: 3px;
    }
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; justify-items: center; }

    .card-visual {
      width: var(--card-w); height: var(--card-h);
      background: #fdfaf0 url("assets/original-card-background.png") center/cover no-repeat;
      border: 12px solid var(--card-border, #9d2b2b);
      border-radius: 20px; position: relative;
      display: flex; flex-direction: column;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      overflow: hidden; color: var(--ink);
    }
    .card-visual::before { content: ""; position: absolute; inset: 8px; border: 1.5px solid rgba(212, 175, 55, 0.5); border-radius: 10px; pointer-events: none; }

    .card-inner { flex: 1; padding: 60px 30px; display: flex; flex-direction: column; align-items: center; position: relative; z-index: 2; text-align: center; }
    h2 { font-size: 26px; font-weight: 700; color: #2d1f19; margin: 0 0 40px; line-height: 1.3; font-family: "PingFang TC", sans-serif; }
    .card-body-text { font-size: 18px; line-height: 2; color: #33251f; font-weight: 400; flex: 1; display: flex; align-items: center; justify-content: center; font-family: "PingFang TC", sans-serif; white-space: pre-line; }

    #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.97); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 3000; padding: 20px; backdrop-filter: blur(15px); }
    .ai-advice { margin-top: 30px; color: var(--gold-light); font-size: 17px; max-width: 360px; text-align: center; font-style: italic; border-top: 1px solid rgba(212,175,55,0.2); padding-top: 20px; }

    .actions { margin-top: 30px; display: flex; gap: 15px; width: 100%; max-width: 340px; }
    .btn { flex: 1; padding: 14px 0; border-radius: 999px; font-weight: bold; cursor: pointer; border: none; font-size: 16px; text-align: center; }
    .btn-gold { background: linear-gradient(180deg, #f4dd97, #d4af37); color: #1a0f0d; }
    .btn-outline { background: transparent; border: 1.5px solid var(--gold); color: var(--gold); }

    .shaking { animation: shuffle 0.6s infinite; }
    @keyframes shuffle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(3deg) translateY(-5px); } 75% { transform: rotate(-3deg) translateY(-5px); } }
    @keyframes flipIn { from { transform: scale(0.8) rotateY(-90deg); opacity: 0; } to { transform: scale(1) rotateY(0); opacity: 1; } }
    .animate-flip { animation: flipIn 0.6s forwards; }

    .library-card { transform: scale(0.9); transition: 0.3s; cursor: pointer; }
    .library-card:hover { transform: scale(0.95); }

    @media (max-width: 480px) {
      :root { --card-w: 300px; --card-h: 500px; }
      .oracle-stage { padding: 20px 16px 26px; min-height: min(94vh, 820px); }
      .brand-logo { width: 70px; margin-bottom: 14px; }
      .hero-subtitle { margin-bottom: 14px; }
      .deck-container { width: min(54vw, 206px); margin-bottom: 18px; }
      .question-shell { height: 68px; }
      .question-input { width: 78%; font-size: 17px; }
      #library-view { padding-top: 88px; }
    }
  </style>
</head>
<body>
  <div class="universe"></div>
  <div class="mode-switch">
    <button id="btn-oracle" class="mode-btn active" onclick="switchMode('oracle')">請示祕密</button>
    <button id="btn-library" class="mode-btn" onclick="switchMode('library')">館藏圖鑑</button>
  </div>
  
  <div id="oracle-view">
    <section class="oracle-stage">
      <div class="brand-logo" aria-hidden="true"></div>
      <h1 class="hero-title">祕密<br>實現卡</h1>
      <div class="hero-divider">✦</div>
      <p class="hero-subtitle">停一停，深呼吸，向內心問一個問題。</p>
      <div class="deck-container" onclick="handleDraw()" aria-label="抽一張牌">
        <div class="card-pile" id="deck-top"></div>
      </div>
      <label class="question-shell" aria-label="你今日想得到咩指引">
        <input id="question-input" class="question-input" type="text" placeholder="你今日想得到咩指引？" maxlength="80">
      </label>
      <div class="hero-actions">
        <button class="image-button" onclick="handleDraw()" aria-label="抽一張牌">
          <img src="assets/manifestation-ui-kit/frontpage-1208/frontpage-draw-button.png" alt="抽一張牌">
        </button>
        <button class="image-button" onclick="switchMode('library')" aria-label="瀏覽牌庫">
          <img src="assets/manifestation-ui-kit/frontpage-1208/frontpage-library-button.png" alt="瀏覽牌庫">
        </button>
      </div>
      <div class="front-ornament">☼</div>
    </section>
  </div>

  <div id="library-view">
    <header style="text-align:center; margin-bottom: 60px;"><h1>館藏圖鑑</h1><p>探索神聖真理</p></header>
    <div class="card-grid" id="grid"></div>
  </div>

  <div id="overlay">
    <article id="active-card" class="card-visual">
      <div class="card-inner"><h2 id="title"></h2><div class="card-body-text" id="text"></div></div>
    </article>
    <div class="ai-advice" id="explanation"></div>
    <div class="actions">
      <button class="btn btn-outline" onclick="closeOverlay()">關閉</button>
      <button class="btn btn-gold" onclick="alert('截圖保存顯化！')">顯化</button>
    </div>
  </div>

  <script>
    /* --- CRITICAL CORE LOGIC GUARD --- 
       DATA AND LOGIC ARE INTEGRATED HERE.
    */
    const db = { cards: [] };

    async function loadDatabase() {
      const response = await fetch('./database/cards.json', { cache: 'no-store' });
      if (!response.ok) throw new Error(`Failed to load cards: ${response.status}`);
      const payload = await response.json();
      db.cards = Array.isArray(payload.cards) ? payload.cards : [];
    }

    const colorMap = {
      green: '#3a9d5d', red: '#c63b43', pink: '#e06bb2', blue_green: '#45b9c8',
      burgundy: '#7e2a35', blue: '#426fcf', light_blue: '#74d5ef', teal: '#28a79a',
      yellow_green: '#7fb62e', olive: '#a79e28', yellow: '#e2b62a', orange: '#e98f1f', white: '#f2ede1',
      purple: '#8e62d9', gold: '#d4af37', unknown: '#d4af37'
    };

    function switchMode(mode) {
      document.getElementById('oracle-view').style.display = (mode === 'oracle') ? 'flex' : 'none';
      document.getElementById('library-view').style.display = (mode === 'library') ? 'block' : 'none';
      document.getElementById('btn-oracle').classList.toggle('active', mode === 'oracle');
      document.getElementById('btn-library').classList.toggle('active', mode === 'library');
      if (mode === 'library') renderLibrary();
    }

    function renderLibrary() {
      const grid = document.getElementById('grid');
      grid.innerHTML = db.cards.map(c => {
        const clr = colorMap[c.border_color] || '#d4af37';
        const txt = (c.visible_text || '').substring(0, 50) + '...';
        return "<div class='card-visual library-card' style='--card-border: " + clr + "' onclick='showSpecificCard(\"" + c.id + "\")'><div class='card-inner'><h2>" + c.title_zh + "</h2><div class='card-body-text'>" + txt + "</div></div></div>";
      }).join('');
    }

    function handleDraw() {
      const deck = document.getElementById('deck-top');
      deck.classList.add('shaking');
      setTimeout(() => { deck.classList.remove('shaking'); revealCard(); }, 1200);
    }

    function revealCard() {
      const card = db.cards[Math.floor(Math.random() * db.cards.length)];
      const question = document.getElementById('question-input').value.trim();
      const msg = question
        ? `你問緊：「${question}」`
        : "你的思想具有磁性。你正在吸引此現實。";
      updateOverlay(card, msg);
    }

    function showSpecificCard(id) {
      const card = db.cards.find(x => x.id === id);
      if (card) updateOverlay(card, "專注於這項真理。");
    }

    function updateOverlay(card, msg) {
      document.getElementById('title').innerText = card.title_zh;
      document.getElementById('text').innerText = card.visible_text;
      document.getElementById('explanation').innerText = msg;
      const ac = document.getElementById('active-card');
      ac.style.setProperty('--card-border', colorMap[card.border_color] || '#d4af37');
      ac.classList.remove('animate-flip');
      void ac.offsetWidth;
      ac.classList.add('animate-flip');
      document.getElementById('overlay').style.display = 'flex';
    }

    function closeOverlay() { document.getElementById('overlay').style.display = 'none'; }

    async function init() {
      await loadDatabase();
      switchMode('oracle');
    }

    init();
  </script>
</body>
</html>
