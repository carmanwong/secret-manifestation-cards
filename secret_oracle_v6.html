<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>祕密實現卡</title>
  <style>
    :root {
      --bg: #f6ead3;
      --bg-2: #ead1a2;
      --card: rgba(255, 249, 240, 0.86);
      --line: rgba(142, 95, 28, 0.18);
      --text: #5f3c19;
      --muted: rgba(95, 60, 25, 0.66);
      --accent: #b85d21;
      --accent-2: #d28b36;
      --shadow: 0 18px 40px rgba(95, 60, 25, 0.12);
      --screen-w: min(100vw, 460px);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: linear-gradient(180deg, var(--bg), var(--bg-2));
      color: var(--text);
      font-family: "Baskerville", "Times New Roman", "PingFang TC", "Noto Serif TC", serif;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .app {
      width: var(--screen-w);
      min-height: 100vh;
      padding: 22px 16px 36px;
      background:
        linear-gradient(rgba(255, 247, 235, 0.34), rgba(255, 247, 235, 0.34)),
        url("./assets/manifestation-ui-kit/backgrounds/golden-altar-background.png") center top / cover no-repeat;
    }

    .topbar {
      display: flex;
      gap: 10px;
      margin-bottom: 22px;
    }

    .tab {
      flex: 1;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 250, 244, 0.8);
      color: var(--muted);
      padding: 12px 16px;
      font: 600 14px/1 "PingFang TC", "Noto Sans TC", sans-serif;
      cursor: pointer;
      box-shadow: var(--shadow);
    }

    .tab.active {
      background: linear-gradient(180deg, var(--accent-2), var(--accent));
      color: #fff8ef;
      border-color: transparent;
    }

    .screen { display: none; }
    .screen.active { display: block; }

    .hero {
      text-align: center;
      padding-top: 8px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 500;
      letter-spacing: 4px;
    }

    .subtitle {
      margin: 10px auto 0;
      max-width: 320px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.8;
    }

    .draw-card {
      margin-top: 24px;
      padding: 18px;
      border-radius: 26px;
      background: var(--card);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }

    .deck {
      width: 200px;
      height: 300px;
      margin: 0 auto 20px;
      border-radius: 22px;
      background:
        linear-gradient(180deg, rgba(255, 225, 158, 0.2), rgba(146, 63, 19, 0.16)),
        url("./assets/original-card-background.png") center / cover no-repeat;
      border: 2px solid rgba(199, 145, 58, 0.74);
      box-shadow: 0 20px 38px rgba(122, 72, 22, 0.18);
      display: grid;
      place-items: center;
      color: rgba(255, 246, 220, 0.92);
      font-size: 76px;
      text-shadow: 0 6px 22px rgba(255,255,255,0.22);
      cursor: pointer;
    }

    .draw-btn {
      width: 100%;
      border: none;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--accent-2), var(--accent));
      color: #fff8ef;
      padding: 16px 18px;
      font: 700 17px/1 "PingFang TC", "Noto Sans TC", sans-serif;
      cursor: pointer;
      box-shadow: 0 14px 28px rgba(143, 77, 20, 0.2);
    }

    .library-head {
      margin-bottom: 16px;
    }

    .search {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 14px 16px;
      background: rgba(255, 249, 240, 0.82);
      color: var(--text);
      font: 400 15px/1 "PingFang TC", "Noto Sans TC", sans-serif;
      outline: none;
      box-shadow: var(--shadow);
    }

    .grid {
      margin-top: 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .library-item {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255, 249, 240, 0.86);
      box-shadow: var(--shadow);
      padding: 14px;
      text-align: left;
      cursor: pointer;
    }

    .library-item-title {
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 8px;
    }

    .library-item-preview {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .empty {
      margin-top: 18px;
      padding: 20px 16px;
      border-radius: 18px;
      background: rgba(255, 249, 240, 0.82);
      border: 1px solid var(--line);
      color: var(--muted);
      text-align: center;
      box-shadow: var(--shadow);
    }

    .overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(53, 30, 12, 0.55);
      backdrop-filter: blur(10px);
      z-index: 50;
    }

    .overlay.open { display: flex; }

    .modal {
      width: min(100%, 420px);
      max-height: calc(100vh - 36px);
      overflow: auto;
      border-radius: 28px;
      background: rgba(255, 249, 240, 0.96);
      border: 1px solid var(--line);
      box-shadow: 0 24px 48px rgba(53, 30, 12, 0.25);
      padding: 20px;
    }

    .modal h2 {
      margin: 0 0 14px;
      font-size: 28px;
      line-height: 1.35;
      font-weight: 500;
      text-align: center;
    }

    .modal-text {
      white-space: pre-wrap;
      line-height: 1.9;
      font-size: 17px;
      text-align: center;
    }

    .modal-actions {
      margin-top: 18px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn {
      border-radius: 999px;
      padding: 13px 16px;
      cursor: pointer;
      font: 600 14px/1 "PingFang TC", "Noto Sans TC", sans-serif;
    }

    .btn-outline {
      border: 1px solid var(--line);
      background: #fffaf2;
      color: var(--text);
    }

    .btn-fill {
      border: none;
      background: linear-gradient(180deg, var(--accent-2), var(--accent));
      color: #fff8ef;
    }

    @media (max-width: 380px) {
      h1 { font-size: 28px; }
      .deck {
        width: 178px;
        height: 268px;
        font-size: 68px;
      }
      .grid {
        grid-template-columns: 1fr;
      }
      .modal h2 { font-size: 24px; }
      .modal-text { font-size: 16px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="topbar">
      <button id="tab-draw" class="tab active" type="button">抽卡</button>
      <button id="tab-library" class="tab" type="button">卡牌庫</button>
    </div>

    <section id="screen-draw" class="screen active">
      <div class="hero">
        <h1>祕密實現卡</h1>
        <p class="subtitle">最基本版本。只保留抽卡同查看牌庫。</p>
      </div>

      <div class="draw-card">
        <div id="deck" class="deck" role="button" tabindex="0" aria-label="抽一張牌">S</div>
        <button id="draw-btn" class="draw-btn" type="button">抽一張牌</button>
      </div>
    </section>

    <section id="screen-library" class="screen">
      <div class="library-head">
        <input id="search" class="search" type="search" placeholder="搜尋卡牌">
      </div>
      <div id="grid" class="grid"></div>
      <div id="empty" class="empty" hidden>搵唔到相符卡牌。</div>
    </section>
  </main>

  <div id="overlay" class="overlay">
    <div class="modal">
      <h2 id="modal-title"></h2>
      <div id="modal-text" class="modal-text"></div>
      <div class="modal-actions">
        <button id="close-btn" class="btn btn-outline" type="button">關閉</button>
        <button id="again-btn" class="btn btn-fill" type="button">再抽一張</button>
      </div>
    </div>
  </div>

  <script>
    const db = { cards: [] };
    const el = {
      tabDraw: document.getElementById('tab-draw'),
      tabLibrary: document.getElementById('tab-library'),
      screenDraw: document.getElementById('screen-draw'),
      screenLibrary: document.getElementById('screen-library'),
      deck: document.getElementById('deck'),
      drawBtn: document.getElementById('draw-btn'),
      search: document.getElementById('search'),
      grid: document.getElementById('grid'),
      empty: document.getElementById('empty'),
      overlay: document.getElementById('overlay'),
      modalTitle: document.getElementById('modal-title'),
      modalText: document.getElementById('modal-text'),
      closeBtn: document.getElementById('close-btn'),
      againBtn: document.getElementById('again-btn')
    };

    function setScreen(name) {
      const draw = name === 'draw';
      el.screenDraw.classList.toggle('active', draw);
      el.screenLibrary.classList.toggle('active', !draw);
      el.tabDraw.classList.toggle('active', draw);
      el.tabLibrary.classList.toggle('active', !draw);
    }

    function showCard(card) {
      el.modalTitle.textContent = card.title_zh || '';
      el.modalText.textContent = card.visible_text || '';
      el.overlay.classList.add('open');
    }

    function closeCard() {
      el.overlay.classList.remove('open');
    }

    function drawCard() {
      if (!db.cards.length) return;
      const card = db.cards[Math.floor(Math.random() * db.cards.length)];
      showCard(card);
    }

    function renderLibrary() {
      const q = (el.search.value || '').trim().toLowerCase();
      const cards = db.cards.filter((card) => {
        if (!q) return true;
        return `${card.title_zh} ${card.visible_text}`.toLowerCase().includes(q);
      });

      el.empty.hidden = cards.length > 0;
      el.grid.innerHTML = cards.map((card) => {
        const preview = (card.visible_text || '').slice(0, 40) + ((card.visible_text || '').length > 40 ? '…' : '');
        return [
          `<button class="library-item" type="button" data-id="${card.id}">`,
          `<div class="library-item-title">${escapeHtml(card.title_zh)}</div>`,
          `<div class="library-item-preview">${escapeHtml(preview)}</div>`,
          `</button>`
        ].join('');
      }).join('');

      Array.from(el.grid.querySelectorAll('.library-item')).forEach((button) => {
        button.addEventListener('click', () => {
          const card = db.cards.find((item) => item.id === button.dataset.id);
          if (card) showCard(card);
        });
      });
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    async function loadDatabase() {
      const response = await fetch('./database/cards.json', { cache: 'no-store' });
      if (!response.ok) throw new Error(`Failed to load cards: ${response.status}`);
      const payload = await response.json();
      db.cards = Array.isArray(payload.cards) ? payload.cards : [];
      renderLibrary();
    }

    function bind() {
      el.tabDraw.addEventListener('click', () => setScreen('draw'));
      el.tabLibrary.addEventListener('click', () => setScreen('library'));
      el.drawBtn.addEventListener('click', drawCard);
      el.deck.addEventListener('click', drawCard);
      el.deck.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          drawCard();
        }
      });
      el.search.addEventListener('input', renderLibrary);
      el.closeBtn.addEventListener('click', closeCard);
      el.againBtn.addEventListener('click', drawCard);
      el.overlay.addEventListener('click', (event) => {
        if (event.target === el.overlay) closeCard();
      });
    }

    async function init() {
      bind();
      await loadDatabase();
    }

    init();
  </script>
</body>
</html>
